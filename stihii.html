<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БУДУМ — Стихии</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Unbounded:wght@200;300&family=DM+Mono:wght@300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:#05050a;
    font-family:'Cormorant Garamond', serif;
    color:#f0ece4;
}

/* ── STARS ── */
.stars { position:fixed; inset:0; z-index:0; }
.star {
    position:absolute; border-radius:50%; background:white;
    animation:twinkle ease-in-out infinite;
}
@keyframes twinkle {
    0%,100%{ opacity:0.08; transform:scale(1); }
    50%{ opacity:0.6; transform:scale(1.4); }
}

/* ── GRAIN ── */
.grain {
    position:fixed; inset:0; z-index:500; pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity:0.5; mix-blend-mode:screen;
}

/* ── COVER ── */
#cover {
    position:fixed; inset:0; z-index:999;
    opacity:0; pointer-events:none;
    transition:opacity 1.1s cubic-bezier(0.4,0,0.2,1);
}

/* ── SHELL ── */
.shell {
    position:relative; z-index:10;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:5rem 2rem 3rem;
}

/* ── LOGO ── */
.logo {
    position:fixed; top:2rem; left:50%; transform:translateX(-50%);
    font-family:'Unbounded',sans-serif; font-weight:200;
    font-size:0.72rem; letter-spacing:0.5em; text-transform:uppercase;
    color:rgba(255,255,255,0.35);
    animation:fadeDown 2s cubic-bezier(0.16,1,0.3,1) 0.3s both;
    white-space:nowrap; z-index:20;
    text-decoration:none;
}

/* ── TITLE ── */
.title-block {
    text-align:center; margin-bottom:3rem;
    animation:fadeUp 2s cubic-bezier(0.16,1,0.3,1) 0.7s both;
}
.eyebrow {
    font-family:'DM Mono',monospace; font-size:0.56rem;
    letter-spacing:0.28em; text-transform:uppercase;
    color:rgba(255,255,255,0.2); margin-bottom:0.9rem;
}
.title {
    font-size:clamp(1.7rem,3.5vw,2.8rem); font-weight:300;
    line-height:1.2; color:rgba(255,255,255,0.78);
}
.title em { font-style:italic; color:#fff; }

/* ── ELEMENTS ROW ── */
.elements {
    display:flex; gap:2.5rem; align-items:flex-end;
    animation:fadeUp 2s cubic-bezier(0.16,1,0.3,1) 1.1s both;
}

/* ── ELEMENT WRAPPER ── */
.el-wrap {
    display:flex; flex-direction:column;
    align-items:center; gap:1.2rem;
    cursor:pointer;
    transition:transform 0.6s cubic-bezier(0.16,1,0.3,1);
}
.el-wrap:hover { transform:translateY(-10px); }

/* ── ORBS ── */
.el-orb {
    position:relative;
    width:clamp(120px,14vw,165px);
    height:clamp(120px,14vw,165px);
    flex-shrink:0;
    transition:transform 0.6s cubic-bezier(0.16,1,0.3,1);
}
.el-wrap:hover .el-orb { transform:scale(1.08); }

/* ── WATER ── */
.orb-water {
    border-radius:62% 38% 55% 45% / 48% 52% 48% 52%;
    background:
        radial-gradient(ellipse 70% 50% at 35% 25%, rgba(160,230,255,0.45) 0%, transparent 55%),
        radial-gradient(ellipse 80% 60% at 60% 55%, rgba(30,120,220,0.6) 0%, transparent 65%),
        radial-gradient(ellipse at 50% 50%, #0c2850 0%, #081c3a 40%, #040e20 100%);
    animation:waterMorph 8s ease-in-out infinite, waterGlow 4s ease-in-out infinite;
}
@keyframes waterMorph {
    0%,100% { border-radius:62% 38% 55% 45% / 48% 52% 48% 52%; }
    25%  { border-radius:50% 50% 45% 55% / 55% 45% 58% 42%; }
    50%  { border-radius:40% 60% 60% 40% / 45% 55% 45% 55%; }
    75%  { border-radius:58% 42% 48% 52% / 52% 48% 55% 45%; }
}
@keyframes waterGlow {
    0%,100% { box-shadow:0 0 40px rgba(30,100,220,0.25),0 0 80px rgba(20,80,180,0.12),inset 0 20px 40px rgba(100,200,255,0.12),inset 0 -10px 30px rgba(10,40,120,0.4); }
    50%     { box-shadow:0 0 60px rgba(40,130,255,0.35),0 0 120px rgba(30,100,220,0.18),inset 0 20px 50px rgba(120,210,255,0.18),inset 0 -10px 40px rgba(10,50,150,0.5); }
}
.orb-water::before {
    content:''; position:absolute; inset:8%; border-radius:inherit;
    background:radial-gradient(ellipse 90% 40% at 50% 30%, rgba(120,210,255,0.2) 0%, transparent 70%);
    animation:waterInner 5s ease-in-out infinite;
}
@keyframes waterInner { 0%,100%{opacity:0.7} 50%{opacity:1} }
.orb-water::after {
    content:''; position:absolute; left:10%; right:10%; top:18%; height:12%;
    border-radius:50%;
    background:linear-gradient(180deg, rgba(180,235,255,0.25) 0%, transparent 100%);
    filter:blur(3px); animation:waterSurface 3s ease-in-out infinite;
}
@keyframes waterSurface { 0%,100%{transform:scaleX(1) translateY(0);opacity:0.5} 50%{transform:scaleX(1.06) translateY(-3px);opacity:0.9} }
.water-pts { position:absolute; inset:0; overflow:hidden; border-radius:inherit; }
.wp {
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7) 0%, rgba(160,230,255,0.3) 30%, transparent 65%);
    border:1px solid rgba(140,210,255,0.4);
    animation:wpt linear infinite;
}
@keyframes wpt {
    0%  { transform:translateY(0) translateX(0) scale(0.3); opacity:0; }
    6%  { opacity:1; } 85%{ opacity:0.7; } 95%{ opacity:0; }
    100%{ transform:translateY(var(--t)) translateX(var(--s)) scale(1.1); opacity:0; }
}

/* ── AIR (ночное небо с золотым рассветом) ── */
.orb-air {
    border-radius:50%;
    background:
        radial-gradient(ellipse 100% 45% at 50% 100%, rgba(200,155,50,0.45) 0%, rgba(160,110,30,0.2) 40%, transparent 70%),
        radial-gradient(ellipse 60% 30% at 25% 90%, rgba(180,130,40,0.2) 0%, transparent 55%),
        radial-gradient(at 50% 50%, #0e0c2a 0%, #06040e 60%, #100e18 100%);
    animation:airMorph 10s ease-in-out infinite, airGlow 6s ease-in-out infinite;
}
@keyframes airMorph {
    0%,100%{ border-radius:50%; }
    20%{ border-radius:55% 45% 50% 50% / 48% 52% 50% 50%; }
    40%{ border-radius:48% 52% 55% 45% / 52% 48% 46% 54%; }
    60%{ border-radius:52% 48% 46% 54% / 46% 54% 52% 48%; }
    80%{ border-radius:46% 54% 52% 48% / 54% 46% 48% 52%; }
}
@keyframes airGlow {
    0%,100%{ box-shadow:0 0 50px rgba(200,165,70,0.2),0 0 100px rgba(160,120,40,0.1),inset 0 -20px 40px rgba(200,155,50,0.18),inset 0 20px 35px rgba(10,8,30,0.6); }
    50%    { box-shadow:0 0 70px rgba(210,175,80,0.3),0 0 140px rgba(180,140,50,0.15),inset 0 -25px 50px rgba(210,165,60,0.25),inset 0 20px 40px rgba(10,8,30,0.7); }
}
.orb-air::before {
    content:''; position:absolute; bottom:0; left:0; right:0; height:45%;
    border-radius:0 0 50% 50% / 0 0 100% 100%;
    background:radial-gradient(ellipse 80% 60% at 50% 100%, rgba(210,170,60,0.35) 0%, rgba(180,130,40,0.15) 45%, transparent 75%);
    filter:blur(3px); animation:airHorizon 5s ease-in-out infinite;
}
@keyframes airHorizon { 0%,100%{opacity:0.8} 50%{opacity:1} }
.orb-air::after {
    content:''; position:absolute; top:8%; left:20%; width:35%; height:25%;
    border-radius:50%;
    background:radial-gradient(ellipse, rgba(200,180,255,0.12) 0%, transparent 70%);
    filter:blur(5px); animation:airStarlight 7s ease-in-out infinite;
}
@keyframes airStarlight { 0%,100%{opacity:0.4} 50%{opacity:0.8} }
.air-motes { position:absolute; inset:0; overflow:hidden; border-radius:inherit; z-index:2; }
.am {
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(210,175,80,0.8), transparent 70%);
    animation:amt linear infinite;
}
@keyframes amt {
    0%  { transform:translateY(var(--sy)) translateX(0) scale(0.5); opacity:0; }
    10% { opacity:0.8; } 90%{ opacity:0.2; }
    100%{ transform:translateY(var(--ey)) translateX(var(--s)) scale(1.1); opacity:0; }
}

/* ── FIRE ── */
.orb-fire {
    border-radius:45% 55% 35% 65% / 60% 40% 65% 35%;
    background:
        radial-gradient(ellipse 60% 80% at 50% 80%, rgba(220,70,5,0.9) 0%, rgba(160,30,5,0.7) 40%, transparent 70%),
        radial-gradient(ellipse 80% 50% at 50% 50%, rgba(100,15,5,0.8) 0%, #0d0503 100%);
    animation:fireMorph 3s ease-in-out infinite, fireGlow 2s ease-in-out infinite;
}
@keyframes fireMorph {
    0%,100%{ border-radius:45% 55% 35% 65% / 60% 40% 65% 35%; }
    20%{ border-radius:50% 50% 40% 60% / 55% 45% 60% 40%; }
    40%{ border-radius:42% 58% 38% 62% / 58% 42% 62% 38%; }
    60%{ border-radius:48% 52% 42% 58% / 62% 38% 58% 42%; }
    80%{ border-radius:44% 56% 36% 64% / 56% 44% 64% 36%; }
}
@keyframes fireGlow {
    0%,100%{ box-shadow:0 0 50px rgba(220,70,10,0.4),0 0 100px rgba(180,40,5,0.2),inset 0 -20px 40px rgba(255,100,10,0.2); }
    33%    { box-shadow:0 0 70px rgba(255,90,10,0.55),0 0 140px rgba(220,50,5,0.3),inset 0 -25px 50px rgba(255,130,20,0.3); }
}
.orb-fire::before {
    content:''; position:absolute; bottom:5%; left:20%; width:60%; height:70%;
    background:
        radial-gradient(ellipse at 50% 90%, rgba(255,160,20,0.5) 0%, rgba(220,80,10,0.3) 40%, transparent 70%),
        radial-gradient(ellipse at 30% 70%, rgba(255,120,10,0.3) 0%, transparent 50%);
    animation:fireCoreFlicker 1.6s ease-in-out infinite alternate;
}
@keyframes fireCoreFlicker {
    0%  { opacity:0.7; transform:scaleY(1) scaleX(0.97); }
    33% { opacity:1;   transform:scaleY(1.08) scaleX(1.01); }
    66% { opacity:0.8; transform:scaleY(0.95) scaleX(1.03); }
    100%{ opacity:0.95;transform:scaleY(1.04) scaleX(0.98); }
}
.orb-fire::after {
    content:''; position:absolute; bottom:-5%; left:10%; width:80%; height:50%;
    background:radial-gradient(ellipse, rgba(255,80,5,0.2) 0%, transparent 70%);
    filter:blur(8px); animation:heatHaze 2.2s ease-in-out infinite alternate;
}
@keyframes heatHaze { 0%{transform:scaleX(0.9);opacity:0.6} 50%{transform:scaleX(1.05);opacity:1} 100%{transform:scaleX(0.95);opacity:0.7} }
.fire-pts { position:absolute; inset:0; overflow:hidden; border-radius:inherit; }
.fp {
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(255,200,50,0.9), rgba(255,80,10,0.4) 50%, transparent);
    animation:fpt linear infinite;
}
@keyframes fpt {
    0%  { transform:translateY(0) translateX(0); opacity:0; }
    5%  { opacity:1; } 80%{ opacity:0.5; }
    100%{ transform:translateY(var(--t)) translateX(var(--s)); opacity:0; }
}

/* ── EARTH ── */
.orb-earth {
    border-radius:50% 50% 55% 45% / 45% 55% 50% 50%;
    background:
        radial-gradient(ellipse 70% 50% at 35% 30%, rgba(80,180,40,0.25) 0%, transparent 55%),
        radial-gradient(ellipse 60% 70% at 65% 70%, rgba(40,130,20,0.3) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 50%, #0e1c08 0%, #091404 50%, #060e03 100%);
    animation:earthMorph 12s ease-in-out infinite, earthGlow 5s ease-in-out infinite;
}
@keyframes earthMorph {
    0%,100%{ border-radius:50% 50% 55% 45% / 45% 55% 50% 50%; }
    25%{ border-radius:48% 52% 52% 48% / 52% 48% 54% 46%; }
    50%{ border-radius:54% 46% 48% 52% / 48% 52% 46% 54%; }
    75%{ border-radius:46% 54% 54% 46% / 54% 46% 52% 48%; }
}
@keyframes earthGlow {
    0%,100%{ box-shadow:0 0 45px rgba(60,160,30,0.2),0 0 90px rgba(40,130,20,0.1),inset 0 15px 35px rgba(100,200,50,0.1),inset 0 -10px 30px rgba(10,60,5,0.5); }
    50%    { box-shadow:0 0 65px rgba(80,200,40,0.3),0 0 130px rgba(60,160,30,0.15),inset 0 20px 45px rgba(120,220,60,0.15),inset 0 -15px 40px rgba(10,70,5,0.6); }
}
.orb-earth::before {
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:
        radial-gradient(ellipse 40% 30% at 25% 55%, rgba(80,200,40,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 35% 25% at 70% 65%, rgba(100,220,50,0.15) 0%, transparent 55%);
    animation:earthBio 4s ease-in-out infinite;
}
@keyframes earthBio { 0%,100%{opacity:0.5} 50%{opacity:1} }
.orb-earth::after {
    content:''; position:absolute; inset:10%; border-radius:inherit;
    background:radial-gradient(ellipse 100% 80% at 50% 120%, rgba(40,160,20,0.15) 0%, transparent 60%);
    animation:earthPulse 3s ease-in-out infinite;
}
@keyframes earthPulse { 0%,100%{transform:scale(1);opacity:0.5} 50%{transform:scale(1.06);opacity:1} }
.earth-pts { position:absolute; inset:0; overflow:hidden; border-radius:inherit; }
.ep {
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(120,230,70,0.85), rgba(60,170,30,0.3) 50%, transparent);
    animation:ept linear infinite;
}
@keyframes ept {
    0%  { transform:translateY(0) translateX(0) scale(0.4); opacity:0; }
    8%  { opacity:0.9; } 85%{ opacity:0.25; }
    100%{ transform:translateY(var(--t)) translateX(var(--s)) scale(1.1); opacity:0; }
}

/* ── LABELS ── */
.el-label { text-align:center; transition:transform 0.5s cubic-bezier(0.16,1,0.3,1); }
.el-wrap:hover .el-label { transform:translateY(3px); }
.el-name {
    font-family:'Unbounded',sans-serif; font-weight:200;
    font-size:0.6rem; letter-spacing:0.22em; text-transform:uppercase;
    display:block; margin-bottom:0.35rem; transition:letter-spacing 0.4s;
}
.el-wrap:hover .el-name { letter-spacing:0.3em; }
.el-mood { font-size:0.9rem; font-weight:300; font-style:italic; line-height:1.5; color:rgba(255,255,255,0.5); transition:color 0.35s; }
.el-wrap:hover .el-mood { color:rgba(255,255,255,0.8); }
.el-tags { font-family:'DM Mono',monospace; font-size:0.48rem; letter-spacing:0.12em; text-transform:uppercase; color:rgba(255,255,255,0.18); margin-top:0.3rem; transition:color 0.35s; }
.el-wrap:hover .el-tags { color:rgba(255,255,255,0.35); }

.el-water .el-name { color:#78c8e8; }
.el-air   .el-name { color:#c8a860; }
.el-fire  .el-name { color:#e87840; }
.el-earth .el-name { color:#78b048; }

/* ── HINT ── */
.hint {
    position:fixed; bottom:2rem; left:50%; transform:translateX(-50%);
    font-family:'DM Mono',monospace; font-size:0.5rem;
    letter-spacing:0.22em; text-transform:uppercase;
    color:rgba(255,255,255,0.15);
    animation:fadeUp 1.5s cubic-bezier(0.16,1,0.3,1) 3s both;
    white-space:nowrap; z-index:20;
}

/* ── KEYFRAMES ── */
@keyframes fadeUp   { from{opacity:0;transform:translateY(20px)}             to{opacity:1;transform:translateY(0)} }
@keyframes fadeDown { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

/* ── RESPONSIVE ── */
@media (max-width:760px) {
    html,body { overflow-y:auto !important; height:auto !important; }
    .shell { height:auto !important; min-height:100svh; padding:3.5rem 1.5rem 5rem; justify-content:flex-start; }
    .elements { gap:1.5rem; flex-wrap:wrap; justify-content:center; }
    .el-orb { width:120px !important; height:120px !important; }
    .title { font-size:1.6rem; }
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="grain"></div>
<div id="cover"></div>

<div class="shell">
    <a href="stihii.html" class="logo">БУДУМ</a>

    <div class="title-block">
        <div class="eyebrow">Прямо сейчас</div>
        <h1 class="title"><em>Ты какая стихия?</em></h1>
    </div>

    <div class="elements">

        <div class="el-wrap el-water" onclick="choose('water')" tabindex="0" role="button">
            <div class="el-orb orb-water">
                <div class="water-pts" id="wpts"></div>
            </div>
            <div class="el-label">
                <span class="el-name">Вода</span>
                <div class="el-mood">Тишина. Глубина.</div>
                <div class="el-tags">покой · интуиция · сон</div>
            </div>
        </div>

        <div class="el-wrap el-air" onclick="choose('air')" tabindex="0" role="button">
            <div class="el-orb orb-air">
                <div class="air-motes" id="amts"></div>
            </div>
            <div class="el-label">
                <span class="el-name">Воздух</span>
                <div class="el-mood">Лёгкость. Ясность.</div>
                <div class="el-tags">мысль · свобода · рост</div>
            </div>
        </div>

        <div class="el-wrap el-fire" onclick="choose('fire')" tabindex="0" role="button">
            <div class="el-orb orb-fire">
                <div class="fire-pts" id="fpts"></div>
            </div>
            <div class="el-label">
                <span class="el-name">Огонь</span>
                <div class="el-mood">Движение. Страсть.</div>
                <div class="el-tags">действие · драйв · воля</div>
            </div>
        </div>

        <div class="el-wrap el-earth" onclick="choose('earth')" tabindex="0" role="button">
            <div class="el-orb orb-earth">
                <div class="earth-pts" id="epts"></div>
            </div>
            <div class="el-label">
                <span class="el-name">Земля</span>
                <div class="el-mood">Корни. Надёжность.</div>
                <div class="el-tags">память · тело · дом</div>
            </div>
        </div>

    </div>

    <div class="hint">Можно менять в любой момент</div>
</div>

<script type="module">
import { supabase } from './js/supabase-client.js'

// ── Проверка авторизации ──
;(async () => {
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) { window.location.href = 'login.html'; return }
})()

// ── Звёзды ──
const sc = document.getElementById('stars')
for (let i = 0; i < 130; i++) {
    const s = document.createElement('div'); s.className = 'star'
    const sz = 0.7 + Math.random() * 1.8
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*6}s;animation-delay:-${Math.random()*7}s;`
    sc.appendChild(s)
}

// ── Частицы воды ──
const wc = document.getElementById('wpts')
for (let i = 0; i < 16; i++) {
    const p = document.createElement('div'); p.className = 'wp'
    const sz = 2 + Math.random() * 6
    p.style.cssText = `width:${sz}px;height:${sz}px;left:${10+Math.random()*80}%;bottom:${5+Math.random()*30}%;--t:${-(60+Math.random()*80)}px;--s:${(Math.random()-.5)*30}px;animation-duration:${3+Math.random()*4}s;animation-delay:-${Math.random()*6}s;`
    wc.appendChild(p)
}

// ── Мотты воздуха (золотые) ──
const ac = document.getElementById('amts')
for (let i = 0; i < 20; i++) {
    const p = document.createElement('div'); p.className = 'am'
    const sz = 1.5 + Math.random() * 4
    p.style.cssText = `width:${sz}px;height:${sz}px;left:${5+Math.random()*90}%;bottom:0;--sy:${10+Math.random()*40}px;--ey:${-(50+Math.random()*80)}px;--s:${(Math.random()-.5)*40}px;animation-duration:${3.5+Math.random()*5}s;animation-delay:-${Math.random()*7}s;`
    ac.appendChild(p)
}

// ── Искры огня ──
const fc = document.getElementById('fpts')
for (let i = 0; i < 24; i++) {
    const p = document.createElement('div'); p.className = 'fp'
    const sz = 1.5 + Math.random() * 4
    p.style.cssText = `width:${sz}px;height:${sz}px;left:${20+Math.random()*60}%;bottom:${Math.random()*20}%;--t:${-(70+Math.random()*100)}px;--s:${(Math.random()-.5)*50}px;animation-duration:${1.5+Math.random()*2.5}s;animation-delay:-${Math.random()*4}s;`
    fc.appendChild(p)
}

// ── Споры земли ──
const ec = document.getElementById('epts')
for (let i = 0; i < 14; i++) {
    const p = document.createElement('div'); p.className = 'ep'
    const sz = 2 + Math.random() * 5
    p.style.cssText = `width:${sz}px;height:${sz}px;left:${10+Math.random()*80}%;bottom:${10+Math.random()*35}%;--t:${-(60+Math.random()*90)}px;--s:${(Math.random()-.5)*28}px;animation-duration:${5+Math.random()*5}s;animation-delay:-${Math.random()*8}s;`
    ec.appendChild(p)
}

// ── Клавиатура ──
document.querySelectorAll('.el-wrap').forEach(el => {
    el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click() }
    })
})

// ── Переход ──
const elementConfig = {
    water: { bg:'#030c18', url:'water.html' },
    air:   { bg:'#06040e', url:'air.html'   },
    fire:  { bg:'#0a0200', url:'fire.html'  },
    earth: { bg:'#040a02', url:'earth.html' },
}

window.choose = async function(type) {
    const cfg = elementConfig[type]

    // Сохраняем выбор в профиле
    const { data: { session } } = await supabase.auth.getSession()
    if (session) {
        await supabase
            .from('profiles')
            .update({ element: type })
            .eq('id', session.user.id)
    }
    sessionStorage.setItem('budum_element', type)

    // Анимация перехода
    const wrap = document.querySelector(`.el-wrap.el-${type}`)
    if (wrap) { wrap.style.transition = 'transform 0.35s cubic-bezier(0.16,1,0.3,1)'; wrap.style.transform = 'scale(1.12) translateY(-6px)' }

    setTimeout(() => {
        const cv = document.getElementById('cover')
        cv.style.background = cfg.bg
        cv.style.pointerEvents = 'all'
        cv.style.opacity = '1'
    }, 250)

    setTimeout(() => { window.location.href = cfg.url }, 1350)
}
</script>

</body>
</html>
