<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БУДУМ — Профиль</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Unbounded:wght@200;300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; min-height:100%; background:#05050a; font-family:'Cormorant Garamond',serif; color:#f0ece4; overflow-x:hidden; }

.bg-layer { position:fixed; inset:0; z-index:0; pointer-events:none; transition:opacity 1.2s; }
.bg-water { background:linear-gradient(160deg,#020810 0%,#041020 20%,#071828 50%,#0a2040 80%,#0d2a55 100%); }
.bg-air   { background:linear-gradient(160deg,#06040e 0%,#0a0820 20%,#0e0c2a 50%,#120e2e 80%,#241a18 100%); }
.bg-fire  { background:linear-gradient(160deg,#050100 0%,#0a0200 20%,#100300 50%,#180500 80%,#260a07 100%); }
.bg-earth { background:linear-gradient(160deg,#020601 0%,#040a02 20%,#060e03 50%,#081204 80%,#0c1a06 100%); }
.bg-glow { position:absolute; bottom:-10%; left:50%; transform:translateX(-50%); width:100%; height:60%; pointer-events:none; filter:blur(40px); transition:background 1.2s; }
.glow-water { background:radial-gradient(ellipse,rgba(30,100,220,0.2) 0%,transparent 70%); }
.glow-air   { background:radial-gradient(ellipse,rgba(200,155,50,0.15) 0%,transparent 70%); }
.glow-fire  { background:radial-gradient(ellipse,rgba(220,70,10,0.25) 0%,transparent 70%); }
.glow-earth { background:radial-gradient(ellipse,rgba(60,160,30,0.18) 0%,transparent 70%); }

.stars { position:fixed; inset:0; z-index:0; pointer-events:none; }
.star { position:absolute; border-radius:50%; background:white; animation:twinkle ease-in-out infinite; }
@keyframes twinkle { 0%,100%{opacity:0.05} 50%{opacity:0.4} }
.grain { position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity:0.4; mix-blend-mode:screen; }

.header { position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between;
    padding:1.2rem 2.5rem; background:rgba(5,5,10,0.72); backdrop-filter:blur(24px);
    border-bottom:1px solid rgba(255,255,255,0.05); }
.logo-btn { font-family:'Unbounded',sans-serif; font-weight:200; font-size:0.72rem; letter-spacing:0.45em;
    text-transform:uppercase; color:rgba(255,255,255,0.4); text-decoration:none; transition:color 0.3s; }
.logo-btn:hover { color:rgba(255,255,255,0.8); }
.header-right { display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap; }
.btn-ghost { font-family:'DM Mono',monospace; font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase;
    padding:0.5rem 1.1rem; background:transparent; color:rgba(255,255,255,0.4);
    border:1px solid rgba(255,255,255,0.1); border-radius:9999px; cursor:pointer; transition:all 0.3s; text-decoration:none; display:inline-block; }
.btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,0.25); }
.btn-primary { font-family:'DM Mono',monospace; font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase;
    padding:0.5rem 1.1rem; background:rgba(255,255,255,0.9); color:#05050a;
    border:none; border-radius:9999px; cursor:pointer; transition:all 0.3s; }
.btn-primary:hover { background:#fff; transform:translateY(-1px); }

.main { position:relative; z-index:10; max-width:1100px; margin:0 auto; padding:3rem 2.5rem 6rem; }

/* IDENTITY */
.identity { display:flex; align-items:flex-start; gap:2.5rem; margin-bottom:4rem;
    animation:fadeUp 1.4s cubic-bezier(0.16,1,0.3,1) 0.3s both; }
.avatar-wrap { position:relative; flex-shrink:0; width:100px; height:100px; }
.avatar-orb { width:100px; height:100px; border-radius:50%; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:'Unbounded',sans-serif; font-weight:200; font-size:2rem; color:#fff;
    position:relative; z-index:2; cursor:pointer;
    transition:transform 0.4s cubic-bezier(0.16,1,0.3,1); }
.avatar-orb:hover { transform:scale(1.05); }
.avatar-orb img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.avatar-glow { position:absolute; inset:-8px; border-radius:50%; animation:avatarPulse 4s ease-in-out infinite; z-index:1; filter:blur(12px); opacity:0.45; }
@keyframes avatarPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
.avatar-upload-btn { position:absolute; bottom:0; right:0; z-index:3;
    width:28px; height:28px; border-radius:50%; border:2px solid rgba(5,5,10,0.8);
    background:rgba(255,255,255,0.9); display:none; align-items:center; justify-content:center;
    cursor:pointer; transition:all 0.2s; font-size:0.75rem; color:#05050a; }
.avatar-upload-btn:hover { background:#fff; transform:scale(1.1); }

.identity-info { flex:1; padding-top:0.5rem; }
.profile-name { font-size:clamp(1.8rem,3.5vw,2.8rem); font-weight:300; line-height:1.1; color:#fff; margin-bottom:0.3rem; }
.profile-handle { font-family:'DM Mono',monospace; font-size:0.62rem; letter-spacing:0.15em;
    color:rgba(255,255,255,0.22); text-transform:uppercase; margin-bottom:0.75rem; }
.dominant-pill { display:none; align-items:center; gap:0.5rem; padding:0.28rem 0.85rem;
    border-radius:9999px; font-family:'DM Mono',monospace; font-size:0.52rem; letter-spacing:0.12em;
    text-transform:uppercase; margin-bottom:0.85rem; border:1px solid; width:fit-content; }
.dominant-dot { width:5px; height:5px; border-radius:50%; animation:dotPulse 2.5s ease-in-out infinite; }
@keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:0.4;transform:scale(1.3)} }
.profile-bio { font-size:0.95rem; color:rgba(255,255,255,0.42); line-height:1.7; max-width:420px; font-style:italic; margin-bottom:1rem; }
.profile-bio-empty { font-size:0.85rem; color:rgba(255,255,255,0.18); font-style:italic; margin-bottom:1rem; cursor:pointer; transition:color 0.2s; }
.profile-bio-empty:hover { color:rgba(255,255,255,0.38); }
.bio-edit-wrap { display:none; margin-bottom:1rem; }
.bio-edit-wrap.open { display:block; }
.bio-input { width:100%; max-width:420px; padding:0.7rem 1rem; background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12); border-radius:0.75rem; color:#fff;
    font-family:'Cormorant Garamond',serif; font-size:0.95rem; font-style:italic;
    outline:none; resize:none; line-height:1.7; transition:border-color 0.3s; }
.bio-input:focus { border-color:rgba(255,255,255,0.28); }
.bio-input::placeholder { color:rgba(255,255,255,0.2); }
.bio-save-row { display:flex; gap:0.5rem; margin-top:0.5rem; }
.profile-stats { display:flex; gap:2rem; }
.stat-val { font-family:'Cormorant Garamond',serif; font-size:1.8rem; font-weight:300; color:#fff; display:block; line-height:1; }
.stat-label { font-family:'DM Mono',monospace; font-size:0.52rem; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.2); margin-top:0.2rem; display:block; }
.identity-actions { display:flex; flex-direction:column; gap:0.6rem; align-items:flex-end; padding-top:0.5rem; flex-shrink:0; }

/* SECTION LABEL */
.section-label { font-family:'DM Mono',monospace; font-size:0.58rem; letter-spacing:0.25em; text-transform:uppercase;
    color:rgba(255,255,255,0.18); margin-bottom:1.75rem; display:flex; align-items:center; gap:1rem; }
.section-label::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.06); }

/* ORBS */
.elements-orbs { display:flex; gap:2.5rem; justify-content:flex-start; flex-wrap:wrap;
    margin-bottom:4rem; animation:fadeUp 1.4s cubic-bezier(0.16,1,0.3,1) 0.5s both; }
.orb-item { display:flex; flex-direction:column; align-items:center; gap:0.75rem;
    cursor:pointer; transition:transform 0.5s cubic-bezier(0.16,1,0.3,1); }
.orb-item:hover { transform:translateY(-8px); }
.orb { width:110px; height:110px; border-radius:50%; position:relative; overflow:hidden;
    transition:transform 0.5s cubic-bezier(0.16,1,0.3,1); flex-shrink:0; }
.orb-item:hover .orb { transform:scale(1.06); }
.orb-item.dominant .orb { width:130px; height:130px; }

.o-water { background:radial-gradient(ellipse 65% 45% at 35% 28%,rgba(150,220,255,0.4) 0%,transparent 55%),radial-gradient(at 50% 50%,#0b2448 0%,#071630 50%,#03080f 100%); animation:wMorph 9s ease-in-out infinite; box-shadow:inset 0 14px 28px rgba(120,215,255,0.13),inset 0 -8px 20px rgba(8,45,140,0.38); }
@keyframes wMorph { 0%,100%{border-radius:62% 38% 55% 45%/48% 52% 48% 52%} 50%{border-radius:40% 60% 60% 40%/44% 56% 44% 56%} }
.o-air { background:radial-gradient(ellipse 100% 45% at 50% 100%,rgba(200,155,50,0.45) 0%,transparent 70%),radial-gradient(at 50% 50%,#0e0c2a 0%,#06040e 60%,#100e18 100%); animation:aMorph 10s ease-in-out infinite; box-shadow:inset 0 -20px 40px rgba(200,155,50,0.18); }
@keyframes aMorph { 0%,100%{border-radius:50%} 50%{border-radius:48% 52% 55% 45%/52% 48% 46% 54%} }
.o-fire { background:radial-gradient(ellipse 60% 80% at 50% 80%,rgba(220,70,5,0.9) 0%,transparent 70%),radial-gradient(at 50% 50%,#100402 0%,#0d0503 100%); animation:fMorph 3.2s ease-in-out infinite; box-shadow:inset 0 -16px 32px rgba(255,95,10,0.18); }
@keyframes fMorph { 0%,100%{border-radius:44% 56% 34% 66%/62% 38% 66% 34%} 50%{border-radius:48% 52% 42% 58%/62% 38% 58% 42%} }
.o-earth { background:radial-gradient(ellipse 68% 48% at 34% 32%,rgba(78,175,38,0.22) 0%,transparent 56%),radial-gradient(at 50% 50%,#0d1b07 0%,#081303 52%,#050a02 100%); animation:eMorph 13s ease-in-out infinite; box-shadow:inset 0 12px 26px rgba(98,195,48,0.09); }
@keyframes eMorph { 0%,100%{border-radius:50% 50% 56% 44%/44% 56% 50% 50%} 50%{border-radius:54% 46% 48% 52%/48% 52% 46% 54%} }

.orb-count { position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    font-family:'DM Mono',monospace; font-size:0.48rem; letter-spacing:0.08em;
    color:rgba(255,255,255,0.7); background:rgba(0,0,0,0.45); padding:0.15rem 0.5rem;
    border-radius:9999px; white-space:nowrap; }
.orb-name { font-family:'Unbounded',sans-serif; font-weight:200; font-size:0.55rem; letter-spacing:0.2em; text-transform:uppercase; }
.orb-item.ow .orb-name { color:#78c8e8; }
.orb-item.oa .orb-name { color:#c8a860; }
.orb-item.of .orb-name { color:#e87840; }
.orb-item.oe .orb-name { color:#78b048; }

/* FRIENDS */
.friends-section { animation:fadeUp 1.4s cubic-bezier(0.16,1,0.3,1) 0.7s both; }
.friends-grid { display:flex; flex-wrap:wrap; gap:0.75rem; }
.friend-chip { display:flex; align-items:center; gap:0.6rem; padding:0.5rem 1rem 0.5rem 0.5rem;
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
    border-radius:9999px; cursor:pointer; transition:all 0.3s; text-decoration:none; }
.friend-chip:hover { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.16); }
.friend-chip-avatar { width:1.6rem; height:1.6rem; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-family:'DM Mono',monospace; font-size:0.6rem; font-weight:600; color:#05050a; flex-shrink:0; }
.friend-chip-name { font-family:'DM Mono',monospace; font-size:0.58rem; letter-spacing:0.08em;
    text-transform:uppercase; color:rgba(255,255,255,0.5); }
.friends-hidden { font-size:0.88rem; color:rgba(255,255,255,0.2); font-style:italic; padding:0.5rem 0; }
.visibility-row { display:flex; align-items:center; gap:0.75rem; margin-top:1rem; }
.visibility-label { font-family:'DM Mono',monospace; font-size:0.55rem; letter-spacing:0.1em;
    text-transform:uppercase; color:rgba(255,255,255,0.25); }
.toggle { position:relative; width:2.2rem; height:1.2rem; flex-shrink:0; }
.toggle input { opacity:0; width:0; height:0; }
.toggle-slider { position:absolute; inset:0; background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.15); border-radius:9999px; cursor:pointer; transition:0.25s; }
.toggle-slider::before { content:''; position:absolute; width:0.75rem; height:0.75rem;
    left:0.2rem; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.35); border-radius:50%; transition:0.25s; }
.toggle input:checked + .toggle-slider { background:rgba(255,255,255,0.2); border-color:rgba(255,255,255,0.3); }
.toggle input:checked + .toggle-slider::before { transform:translateX(1rem) translateY(-50%); background:#fff; }

/* MODAL */
.modal-overlay { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.78); backdrop-filter:blur(20px);
    display:flex; align-items:center; justify-content:center; padding:2rem; opacity:0; pointer-events:none; transition:opacity 0.3s; }
.modal-overlay.open { opacity:1; pointer-events:all; }
.modal { background:#0e0e16; border:1px solid rgba(255,255,255,0.1); border-radius:1.75rem; padding:2.5rem;
    width:100%; max-width:480px; animation:slideUp 0.4s cubic-bezier(0.16,1,0.3,1); }
.modal-title { font-size:1.6rem; font-weight:300; font-style:italic; color:#fff; margin-bottom:0.75rem; }
.modal-sub { font-size:0.85rem; color:rgba(255,255,255,0.35); margin-bottom:1.5rem; line-height:1.6; }
.invite-link-row { display:flex; gap:0.5rem; }
.invite-link-input { flex:1; padding:0.75rem 1rem; background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1); border-radius:0.75rem; color:#fff;
    font-family:'DM Mono',monospace; font-size:0.58rem; outline:none; }
.modal-footer { display:flex; justify-content:flex-end; margin-top:1.5rem; }

.loading { display:flex; align-items:center; gap:0.5rem; color:rgba(255,255,255,0.2);
    font-family:'DM Mono',monospace; font-size:0.65rem; padding:2rem 0; }
.loading-dot { width:4px; height:4px; border-radius:50%; background:rgba(255,255,255,0.3); animation:ldot 1.2s ease-in-out infinite; }
.loading-dot:nth-child(2){animation-delay:0.2s} .loading-dot:nth-child(3){animation-delay:0.4s}
@keyframes ldot{0%,100%{opacity:0.2}50%{opacity:1}}
.toast-area { position:fixed; bottom:2rem; right:2rem; z-index:999; display:flex; flex-direction:column; gap:0.5rem; }
.toast { padding:0.75rem 1.25rem; background:rgba(14,14,22,0.95); border:1px solid rgba(255,255,255,0.1);
    border-radius:0.75rem; font-size:0.82rem; color:#fff; animation:toastIn 0.3s cubic-bezier(0.16,1,0.3,1); max-width:280px; }
.toast.success { border-color:#78c8e8; color:#78c8e8; }
.toast.error { border-color:#e05a3a; color:#e05a3a; }

@keyframes fadeUp  { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
@keyframes toastIn { from{opacity:0;transform:translateX(1rem)} to{opacity:1;transform:translateX(0)} }

@media(max-width:768px){
    .header{padding:1rem 1.25rem}
    .main{padding:2rem 1.25rem 5rem}
    .identity{flex-direction:column;gap:1.5rem}
    .identity-actions{flex-direction:row;flex-wrap:wrap}
    .elements-orbs{gap:1.5rem}
    .orb{width:80px !important;height:80px !important}
    .orb-item.dominant .orb{width:95px !important;height:95px !important}
}
</style>
</head>
<body>

<div class="bg-layer bg-water" id="bg-layer"></div>
<div class="bg-glow glow-water" id="bg-glow"></div>
<div class="stars" id="stars"></div>
<div class="grain"></div>
<div class="toast-area" id="toast-area"></div>

<header class="header">
    <a href="stihii.html" class="logo-btn">БУДУМ</a>
    <div class="header-right" id="header-actions"></div>
</header>

<main class="main">
    <div class="identity">
        <div class="avatar-wrap">
            <div class="avatar-glow" id="avatar-glow"></div>
            <div class="avatar-orb" id="avatar-orb">?</div>
            <div class="avatar-upload-btn" id="avatar-upload-btn" title="Загрузить фото" onclick="document.getElementById('avatar-file-input').click()">✎</div>
            <input type="file" id="avatar-file-input" accept="image/*" style="display:none">
        </div>
        <div class="identity-info">
            <div class="profile-name" id="name-text">...</div>
            <div class="profile-handle" id="profile-handle"></div>
            <div class="dominant-pill" id="dominant-pill"></div>
            <div class="profile-bio" id="profile-bio" style="display:none"></div>
            <div class="profile-bio-empty" id="bio-empty" style="display:none" onclick="openBioEdit()">+ Добавить bio</div>
            <div class="bio-edit-wrap" id="bio-edit-wrap">
                <textarea class="bio-input" id="bio-input" rows="2" placeholder="Несколько слов о себе..."></textarea>
                <div class="bio-save-row">
                    <button class="btn-primary" onclick="saveBio()">Сохранить</button>
                    <button class="btn-ghost" onclick="closeBioEdit()">Отмена</button>
                </div>
            </div>
            <div class="profile-stats">
                <div><span class="stat-val" id="stat-collections">—</span><span class="stat-label">коллекций</span></div>
                <div><span class="stat-val" id="stat-materials">—</span><span class="stat-label">материалов</span></div>
            </div>
        </div>
        <div class="identity-actions" id="identity-actions"></div>
    </div>

    <div class="section-label">Стихии</div>
    <div class="elements-orbs" id="elements-orbs">
        <div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>
    </div>

    <div id="friends-section" style="display:none">
        <div class="section-label">Друзья</div>
        <div id="friends-list"></div>
    </div>
</main>

<div class="modal-overlay" id="invite-modal" onclick="if(event.target===this)closeInviteModal()">
    <div class="modal">
        <div class="modal-title">Пригласить друга</div>
        <div class="modal-sub">Поделись ссылкой — друг увидит твой профиль и сможет добавиться.</div>
        <div class="invite-link-row">
            <input class="invite-link-input" id="invite-link-input" readonly>
            <button class="btn-primary" onclick="copyInviteLink()">Копировать</button>
        </div>
        <div class="modal-footer"><button class="btn-ghost" onclick="closeInviteModal()">Закрыть</button></div>
    </div>
</div>

<script type="module">
import { supabase, getCurrentUser } from './js/supabase-client.js'

const ELEMENT_CONFIG = {
    water: { name:'Вода',   url:'water.html',  cls:'ow', orbCls:'o-water', accent:'#78c8e8', glowCls:'glow-water', bgCls:'bg-water', pillBg:'rgba(120,200,232,0.1)',  pillBorder:'rgba(120,200,232,0.28)' },
    air:   { name:'Воздух', url:'air.html',    cls:'oa', orbCls:'o-air',   accent:'#c8a860', glowCls:'glow-air',   bgCls:'bg-air',   pillBg:'rgba(200,168,96,0.1)',   pillBorder:'rgba(200,168,96,0.28)' },
    fire:  { name:'Огонь',  url:'fire.html',   cls:'of', orbCls:'o-fire',  accent:'#e87840', glowCls:'glow-fire',  bgCls:'bg-fire',  pillBg:'rgba(232,120,64,0.1)',   pillBorder:'rgba(232,120,64,0.28)' },
    earth: { name:'Земля',  url:'earth.html',  cls:'oe', orbCls:'o-earth', accent:'#78b048', glowCls:'glow-earth', bgCls:'bg-earth', pillBg:'rgba(120,176,72,0.1)',   pillBorder:'rgba(120,176,72,0.28)' },
}
const AVATAR_BG = {
    water:'linear-gradient(135deg,#0b2448,#1a6090)',
    air:  'linear-gradient(135deg,#06040e,#c8a860)',
    fire: 'linear-gradient(135deg,#3a0a02,#c04020)',
    earth:'linear-gradient(135deg,#0a1804,#3a7820)',
}

let currentUser = null
let profileUser = null
let isOwnProfile = true
let userTier = 'seeker'

// Stars
const sc = document.getElementById('stars')
for (let i = 0; i < 110; i++) {
    const s = document.createElement('div'); s.className = 'star'
    const sz = 0.6 + Math.random() * 1.7
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2.5+Math.random()*5}s;animation-delay:-${Math.random()*7}s;`
    sc.appendChild(s)
}

function toast(msg, type='') {
    const a = document.getElementById('toast-area')
    const d = document.createElement('div'); d.className = 'toast '+type; d.textContent = msg
    a.appendChild(d); setTimeout(() => d.remove(), 3500)
}

// INIT
;(async () => {
    const user = await getCurrentUser()
    if (!user) { window.location.href = 'login.html'; return }
    currentUser = user
    userTier = user.profile?.tier || 'seeker'

    const params = new URLSearchParams(window.location.search)
    const inviteToken = params.get('invite')
    const viewNick = params.get('user')

    if (inviteToken) { await handleInvite(inviteToken); return }

    if (viewNick && viewNick.toLowerCase() !== user.profile?.nickname?.toLowerCase()) {
        isOwnProfile = false
        const { data: fp } = await supabase.from('profiles').select('*').eq('nickname', viewNick).single()
        if (!fp) { toast('Пользователь не найден', 'error'); return }
        profileUser = fp
    } else {
        profileUser = user.profile
    }

    await loadProfile()
})()

async function loadProfile() {
    const uid = profileUser.id
    document.getElementById('name-text').textContent = profileUser.nickname || '?'
    document.getElementById('profile-handle').textContent = `@${profileUser.nickname || '?'}`
    document.title = `БУДУМ — ${profileUser.nickname}`

    // Bio
    if (profileUser.bio) {
        document.getElementById('profile-bio').textContent = profileUser.bio
        document.getElementById('profile-bio').style.display = ''
    } else if (isOwnProfile) {
        document.getElementById('bio-empty').style.display = ''
    }

    // Avatar
    const orb = document.getElementById('avatar-orb')
    if (profileUser.avatar_url) {
        orb.innerHTML = `<img src="${profileUser.avatar_url}" alt="avatar">`
        orb.style.background = 'transparent'
    } else {
        const el = profileUser.element || 'water'
        orb.textContent = (profileUser.nickname || '?').charAt(0).toUpperCase()
        orb.style.background = AVATAR_BG[el]
        document.getElementById('avatar-glow').style.background = AVATAR_BG[el]
    }
    if (isOwnProfile) {
        const btn = document.getElementById('avatar-upload-btn')
        btn.style.display = 'flex'
        document.getElementById('avatar-file-input').addEventListener('change', uploadAvatar)
    }

    // Collections
    const { data: cols } = await supabase.from('collections').select('*, materials(count)').eq('user_id', uid)
    const allCols = cols || []
    const counts = { water:0, air:0, fire:0, earth:0 }
    let totalMats = 0
    allCols.forEach(c => {
        if (counts[c.element] !== undefined) counts[c.element]++
        totalMats += c.materials?.[0]?.count || 0
    })
    const visibleCols = isOwnProfile ? allCols : allCols.filter(c => c.is_public)
    document.getElementById('stat-collections').textContent = visibleCols.length
    document.getElementById('stat-materials').textContent = totalMats

    // Dominant element
    const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1])
    const dominant = sorted[0]
    if (dominant && dominant[1] > 0) applyDominantTheme(dominant[0])

    // Orbs
    renderOrbs(counts)

    // Header
    renderHeader()

    // Friends
    await loadFriends(uid)
}

function applyDominantTheme(el) {
    const cfg = ELEMENT_CONFIG[el]; if (!cfg) return
    document.getElementById('bg-layer').className = `bg-layer ${cfg.bgCls}`
    document.getElementById('bg-glow').className = `bg-glow ${cfg.glowCls}`
    const pill = document.getElementById('dominant-pill')
    pill.style.display = 'flex'
    pill.style.background = cfg.pillBg
    pill.style.borderColor = cfg.pillBorder
    pill.style.color = cfg.accent
    pill.innerHTML = `<div class="dominant-dot" style="background:${cfg.accent}"></div>Доминирует ${cfg.name}`
    if (!profileUser.avatar_url) {
        document.getElementById('avatar-glow').style.background = AVATAR_BG[el]
    }
}

function renderOrbs(counts) {
    const wrap = document.getElementById('elements-orbs')
    wrap.innerHTML = ''
    const maxCount = Math.max(...Object.values(counts))
    Object.entries(ELEMENT_CONFIG).forEach(([key, cfg]) => {
        const count = counts[key] || 0
        const isDominant = count > 0 && count === maxCount
        const item = document.createElement('div')
        item.className = `orb-item ${cfg.cls}${isDominant ? ' dominant' : ''}`
        item.onclick = () => {
            if (isOwnProfile) window.location.href = cfg.url
            else window.location.href = `${cfg.url}?view=${profileUser.nickname}`
        }
        item.innerHTML = `
            <div class="orb ${cfg.orbCls}">
                ${count > 0 ? `<div class="orb-count">${count}</div>` : ''}
            </div>
            <div class="orb-name">${cfg.name}</div>
        `
        wrap.appendChild(item)
    })
}

function renderHeader() {
    const ha = document.getElementById('header-actions')
    if (isOwnProfile) {
        ha.innerHTML = `
            ${userTier === 'keeper' ? '<button class="btn-ghost" onclick="openInviteModal()">Пригласить друга</button>' : '<button class="btn-primary" onclick="window.location.href=\'subscribe.html\'">Стать Хранителем</button>'}
            <a href="stihii.html" class="btn-ghost">Стихии</a>
            <button class="btn-ghost" onclick="doLogout()">Выйти</button>
        `
    } else {
        ha.innerHTML = `<a href="stihii.html" class="btn-ghost">← Стихии</a>`
        if (userTier === 'keeper') {
            const btn = document.createElement('button')
            btn.className = 'btn-ghost'
            btn.id = 'friend-btn'
            btn.textContent = '...'
            ha.prepend(btn)
            checkFriendship()
        }
    }
}

async function loadFriends(uid) {
    const section = document.getElementById('friends-section')
    const list = document.getElementById('friends-list')

    const { data: fs } = await supabase.from('friendships').select('user_from,user_to')
        .eq('status','accepted').or(`user_from.eq.${uid},user_to.eq.${uid}`)

    if (!fs?.length) {
        if (isOwnProfile) {
            section.style.display = ''
            list.innerHTML = `<div class="friends-hidden">Пока нет друзей — <span style="cursor:pointer;color:rgba(255,255,255,0.45)" onclick="openInviteModal()">пригласи первого →</span></div>`
        }
        return
    }

    section.style.display = ''

    if (!isOwnProfile && profileUser.show_friends === false) {
        list.innerHTML = `<div class="friends-hidden">Список друзей скрыт</div>`
        return
    }

    const friendIds = fs.map(f => f.user_from === uid ? f.user_to : f.user_from).filter(Boolean)
    const { data: profiles } = await supabase.from('profiles').select('id,nickname,element,avatar_url').in('id', friendIds)

    const grid = document.createElement('div'); grid.className = 'friends-grid'
    ;(profiles || []).forEach(p => {
        const chip = document.createElement('a')
        chip.className = 'friend-chip'
        chip.href = `profile.html?user=${p.nickname}`
        const el = p.element || 'water'
        chip.innerHTML = p.avatar_url
            ? `<img src="${p.avatar_url}" style="width:1.6rem;height:1.6rem;border-radius:50%;object-fit:cover;flex-shrink:0"><div class="friend-chip-name">${p.nickname}</div>`
            : `<div class="friend-chip-avatar" style="background:${AVATAR_BG[el]}">${p.nickname.charAt(0).toUpperCase()}</div><div class="friend-chip-name">${p.nickname}</div>`
        grid.appendChild(chip)
    })
    list.appendChild(grid)

    // Переключатель видимости — только для своего
    if (isOwnProfile) {
        const row = document.createElement('div'); row.className = 'visibility-row'
        const checked = profileUser.show_friends !== false
        row.innerHTML = `
            <span class="visibility-label" id="vis-label">${checked ? 'Список виден друзьям' : 'Список скрыт'}</span>
            <label class="toggle">
                <input type="checkbox" id="show-friends-toggle" ${checked ? 'checked' : ''}>
                <span class="toggle-slider"></span>
            </label>
        `
        list.appendChild(row)
        document.getElementById('show-friends-toggle').addEventListener('change', toggleFriendsVisibility)
    }
}

async function checkFriendship() {
    const btn = document.getElementById('friend-btn'); if (!btn) return
    const { data: fs } = await supabase.from('friendships').select('id')
        .eq('status','accepted')
        .or(`and(user_from.eq.${currentUser.id},user_to.eq.${profileUser.id}),and(user_from.eq.${profileUser.id},user_to.eq.${currentUser.id})`)
    if (fs?.length) {
        btn.textContent = '◎ Вы друзья'; btn.style.opacity = '0.6'
    } else {
        btn.textContent = 'Добавить в друзья →'
        btn.onclick = openInviteModal
    }
}

window.toggleFriendsVisibility = async function() {
    const show = document.getElementById('show-friends-toggle').checked
    document.getElementById('vis-label').textContent = show ? 'Список виден друзьям' : 'Список скрыт'
    await supabase.from('profiles').update({ show_friends: show }).eq('id', currentUser.id)
    profileUser.show_friends = show
    toast(show ? 'Список друзей открыт' : 'Список друзей скрыт', 'success')
}

window.openBioEdit = function() {
    document.getElementById('bio-edit-wrap').classList.add('open')
    document.getElementById('bio-input').value = profileUser.bio || ''
    document.getElementById('bio-empty').style.display = 'none'
    document.getElementById('profile-bio').style.display = 'none'
}
window.closeBioEdit = function() {
    document.getElementById('bio-edit-wrap').classList.remove('open')
    if (profileUser.bio) document.getElementById('profile-bio').style.display = ''
    else document.getElementById('bio-empty').style.display = ''
}
window.saveBio = async function() {
    const bio = document.getElementById('bio-input').value.trim()
    const { error } = await supabase.from('profiles').update({ bio }).eq('id', currentUser.id)
    if (error) { toast('Ошибка сохранения', 'error'); return }
    profileUser.bio = bio
    if (bio) { document.getElementById('profile-bio').textContent = bio; document.getElementById('profile-bio').style.display = ''; document.getElementById('bio-empty').style.display = 'none'; }
    else { document.getElementById('profile-bio').style.display = 'none'; document.getElementById('bio-empty').style.display = ''; }
    closeBioEdit(); toast('Bio сохранено ◎', 'success')
}

async function uploadAvatar(e) {
    const file = e.target.files?.[0]; if (!file) return
    if (file.size > 2 * 1024 * 1024) { toast('Макс 2MB', 'error'); return }
    toast('Загружаем...')
    const ext = file.name.split('.').pop()
    const path = `${currentUser.id}/avatar.${ext}`
    const { error: upErr } = await supabase.storage.from('avatars').upload(path, file, { upsert:true })
    if (upErr) { toast('Ошибка: ' + upErr.message, 'error'); return }
    const { data: urlData } = supabase.storage.from('avatars').getPublicUrl(path)
    const url = urlData.publicUrl + '?t=' + Date.now()
    await supabase.from('profiles').update({ avatar_url: url }).eq('id', currentUser.id)
    profileUser.avatar_url = url
    const orb = document.getElementById('avatar-orb')
    orb.innerHTML = `<img src="${url}" alt="avatar">`
    orb.style.background = 'transparent'
    toast('Аватарка обновлена ◎', 'success')
}

window.openInviteModal = async function() {
    const token = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('')
    await supabase.from('friendships').insert({ user_from: currentUser.id, user_to: null, token, status: 'pending' })
    const base = window.location.href.split('?')[0].split('#')[0]
    document.getElementById('invite-link-input').value = `${base}?invite=${token}`
    document.getElementById('invite-modal').classList.add('open')
}
window.closeInviteModal = () => document.getElementById('invite-modal').classList.remove('open')
window.copyInviteLink = function() {
    navigator.clipboard.writeText(document.getElementById('invite-link-input').value)
    toast('Ссылка скопирована ◎', 'success')
}

async function handleInvite(token) {
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) { window.location.href = `login.html?next=${encodeURIComponent(window.location.href)}`; return }
    const { data: invite } = await supabase.from('friendships').select('*').eq('token', token).eq('status','pending').single()
    if (!invite) { toast('Ссылка недействительна', 'error'); profileUser = currentUser.profile; await loadProfile(); return }
    if (invite.user_from === session.user.id) { toast('Это твоя ссылка', 'error'); profileUser = currentUser.profile; await loadProfile(); return }
    await supabase.from('friendships').update({ user_to: session.user.id, status: 'accepted' }).eq('id', invite.id)
    const mt = Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b=>b.toString(16).padStart(2,'0')).join('')
    await supabase.from('friendships').insert({ user_from: session.user.id, user_to: invite.user_from, token: mt, status: 'accepted' })
    toast('Вы теперь друзья! ◎', 'success')
    const { data: fp } = await supabase.from('profiles').select('*').eq('id', invite.user_from).single()
    profileUser = fp || currentUser.profile; isOwnProfile = !fp
    await loadProfile()
}

window.doLogout = async function() {
    await supabase.auth.signOut()
    window.location.href = 'login.html'
}
</script>
</body>
