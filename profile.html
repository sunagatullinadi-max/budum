<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БУДУМ — Профиль</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Unbounded:wght@200;300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; min-height:100%; background:#05050a; font-family:'Cormorant Garamond',serif; color:#f0ece4; overflow-x:hidden; }

/* ── LIVING BACKGROUND ── */
.bg-layer { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }

/* ── WATER BG ── */
.bg-water { position:absolute; inset:0; display:none; }
.active-water .bg-water { display:block; }
.water-deep { position:absolute; inset:0; background:linear-gradient(180deg,#020810 0%,#041020 15%,#061828 35%,#082040 55%,#0a2850 75%,#0c3060 100%); }
.water-caustics { position:absolute; inset:0; overflow:hidden; }
.water-caustic { position:absolute; top:-20%; left:50%; transform:translateX(-50%); width:120%; height:80%;
    background:radial-gradient(ellipse 30% 60% at 30% 0%,rgba(60,160,255,0.12) 0%,transparent 60%),radial-gradient(ellipse 20% 50% at 60% 0%,rgba(80,180,255,0.09) 0%,transparent 55%),radial-gradient(ellipse 25% 55% at 80% 0%,rgba(50,140,220,0.08) 0%,transparent 50%);
    animation:causticSway 8s ease-in-out infinite; filter:blur(2px); }
.water-caustic:nth-child(2) { animation-delay:-3s; animation-duration:10s; background:radial-gradient(ellipse 25% 50% at 20% 0%,rgba(40,140,230,0.08) 0%,transparent 55%),radial-gradient(ellipse 30% 60% at 55% 0%,rgba(70,170,255,0.1) 0%,transparent 60%),radial-gradient(ellipse 20% 45% at 85% 0%,rgba(60,160,240,0.07) 0%,transparent 50%); }
@keyframes causticSway { 0%,100%{transform:translateX(-50%) skewX(0deg) scaleX(1);opacity:0.8} 25%{transform:translateX(-48%) skewX(1.5deg) scaleX(1.03);opacity:1} 50%{transform:translateX(-52%) skewX(-1deg) scaleX(0.98);opacity:0.7} 75%{transform:translateX(-49%) skewX(0.8deg) scaleX(1.02);opacity:0.9} }
.water-shafts { position:absolute; top:0; left:0; right:0; height:70%; overflow:hidden; }
.water-shaft { position:absolute; top:0; height:100%; background:linear-gradient(180deg,rgba(120,210,255,0.25) 0%,rgba(80,170,255,0.08) 50%,transparent 100%); filter:blur(6px); animation:shaftSway ease-in-out infinite; transform-origin:top center; }
.water-shaft:nth-child(1){left:18%;width:60px;animation-duration:7s;opacity:0.6}
.water-shaft:nth-child(2){left:38%;width:40px;animation-duration:9s;animation-delay:-2s;opacity:0.4}
.water-shaft:nth-child(3){left:58%;width:80px;animation-duration:6s;animation-delay:-4s;opacity:0.5}
.water-shaft:nth-child(4){left:75%;width:35px;animation-duration:11s;animation-delay:-1s;opacity:0.3}
@keyframes shaftSway { 0%,100%{transform:skewX(0deg) scaleX(1)} 33%{transform:skewX(3deg) scaleX(0.85)} 66%{transform:skewX(-2deg) scaleX(1.1)} }
.water-glow { position:absolute; bottom:-20%; left:50%; transform:translateX(-50%); width:100%; height:60%; background:radial-gradient(ellipse at 50% 100%,rgba(20,80,200,0.25) 0%,rgba(10,50,150,0.1) 40%,transparent 70%); animation:deepGlow 6s ease-in-out infinite; }
@keyframes deepGlow { 0%,100%{opacity:0.6;transform:translateX(-50%) scaleY(1)} 50%{opacity:1;transform:translateX(-50%) scaleY(1.15)} }
.water-particles { position:absolute; inset:0; overflow:hidden; }
.water-p { position:absolute; border-radius:50%; background:radial-gradient(circle,rgba(120,220,255,0.8),rgba(60,160,255,0.3) 50%,transparent); animation:waterPFloat linear infinite; }
@keyframes waterPFloat { 0%{transform:translateY(0) translateX(0) scale(0.3);opacity:0} 6%{opacity:0.9} 85%{opacity:0.4} 100%{transform:translateY(var(--t)) translateX(var(--s)) scale(1);opacity:0} }

/* ── AIR BG ── */
.bg-air { position:absolute; inset:0; display:none; }
.active-air .bg-air { display:block; }
.air-sky { position:absolute; inset:0; background:radial-gradient(ellipse 100% 40% at 50% 100%,rgba(200,155,50,0.22) 0%,rgba(160,110,30,0.1) 40%,transparent 70%),linear-gradient(180deg,#06040e 0%,#0a0820 20%,#0e0c2a 45%,#120e2e 65%,#1a1228 85%,#241a18 100%); }
.air-sun { position:absolute; bottom:-5%; left:50%; transform:translateX(-50%); width:120vw; height:35vw; background:radial-gradient(ellipse,rgba(210,165,55,0.28) 0%,rgba(185,135,40,0.15) 35%,transparent 75%); filter:blur(35px); animation:sunPulse 9s ease-in-out infinite; }
@keyframes sunPulse { 0%,100%{transform:translateX(-50%) scale(1);opacity:0.8} 50%{transform:translateX(-50%) scale(1.08);opacity:1} }
.air-clouds-bg { position:absolute; inset:0; overflow:hidden; }
.air-cloud-bg { position:absolute; background:rgba(255,252,245,0.06); border-radius:100px; filter:blur(22px); animation:cloudFloat linear infinite; }
.air-cloud-bg::before,.air-cloud-bg::after { content:''; position:absolute; background:rgba(255,252,245,0.06); border-radius:50%; }
.air-cloud-bg:nth-child(1){width:35vw;height:8vw;top:12%;left:-30%;animation-duration:70s;opacity:0.5}
.air-cloud-bg:nth-child(1)::before{width:50%;height:180%;top:-60%;left:15%}
.air-cloud-bg:nth-child(1)::after{width:40%;height:160%;top:-50%;left:50%}
.air-cloud-bg:nth-child(2){width:28vw;height:6vw;top:28%;left:-25%;animation-duration:90s;animation-delay:-20s;opacity:0.35}
.air-cloud-bg:nth-child(3){width:22vw;height:5vw;top:45%;left:-20%;animation-duration:60s;animation-delay:-35s;opacity:0.3}
.air-cloud-bg:nth-child(4){width:40vw;height:9vw;top:8%;left:-35%;animation-duration:110s;animation-delay:-10s;opacity:0.25}
@keyframes cloudFloat { 0%{transform:translateX(0)} 100%{transform:translateX(140vw)} }
.air-motes-bg { position:absolute; inset:0; overflow:hidden; }
.air-mote-bg { position:absolute; border-radius:50%; background:radial-gradient(circle,rgba(210,175,80,0.75),rgba(180,140,50,0.2) 60%,transparent); animation:moteBg linear infinite; }
@keyframes moteBg { 0%{transform:translateY(var(--sy)) translateX(0) scale(0.5);opacity:0} 8%{opacity:0.7} 90%{opacity:0.15} 100%{transform:translateY(var(--ey)) translateX(var(--s)) scale(1.2);opacity:0} }

/* ── FIRE BG ── */
.bg-fire { position:absolute; inset:0; display:none; }
.active-fire .bg-fire { display:block; }
.fire-dark { position:absolute; inset:0; background:linear-gradient(180deg,#060200 0%,#0e0403 20%,#160605 45%,#1e0806 70%,#260a07 100%); }
.fire-core { position:absolute; bottom:-10%; left:50%; transform:translateX(-50%); width:80%; height:70%;
    background:radial-gradient(ellipse at 50% 100%,rgba(255,80,10,0.3) 0%,rgba(200,40,5,0.15) 40%,transparent 70%),radial-gradient(ellipse at 30% 90%,rgba(255,120,20,0.2) 0%,transparent 50%),radial-gradient(ellipse at 70% 90%,rgba(220,60,5,0.18) 0%,transparent 50%);
    animation:fireCoreAnim 2s ease-in-out infinite alternate; }
@keyframes fireCoreAnim { 0%{transform:translateX(-50%) scaleX(0.97) scaleY(1);opacity:0.8} 33%{transform:translateX(-50%) scaleX(1.02) scaleY(1.06);opacity:1} 66%{transform:translateX(-50%) scaleX(0.99) scaleY(0.97);opacity:0.85} 100%{transform:translateX(-50%) scaleX(1.01) scaleY(1.03);opacity:0.9} }
.fire-flames-bg { position:absolute; bottom:0; left:0; right:0; height:55%; overflow:hidden; }
.fire-flame-bg { position:absolute; bottom:0; border-radius:50% 50% 25% 25%; mix-blend-mode:screen; transform-origin:bottom center; }
.fire-flame-bg:nth-child(1){width:40%;height:80%;left:30%;background:radial-gradient(ellipse at 50% 85%,rgba(255,150,20,0.4),rgba(220,60,5,0.2) 50%,transparent 75%);animation:flameBg1 2.2s ease-in-out infinite alternate}
.fire-flame-bg:nth-child(2){width:30%;height:65%;left:10%;background:radial-gradient(ellipse at 50% 85%,rgba(255,100,10,0.3),rgba(180,30,5,0.15) 50%,transparent 75%);animation:flameBg2 1.8s ease-in-out infinite alternate;animation-delay:-0.5s}
.fire-flame-bg:nth-child(3){width:30%;height:60%;right:10%;background:radial-gradient(ellipse at 50% 85%,rgba(255,110,15,0.28),rgba(200,40,5,0.14) 50%,transparent 75%);animation:flameBg1 2.5s ease-in-out infinite alternate;animation-delay:-1s}
@keyframes flameBg1 { 0%{transform:scaleX(1) scaleY(1) translateY(0)} 50%{transform:scaleX(0.94) scaleY(1.09) translateY(-4px)} 100%{transform:scaleX(1.05) scaleY(0.94) translateY(2px)} }
@keyframes flameBg2 { 0%{transform:scaleX(1.02) scaleY(0.97) translateY(1px) rotate(-1deg)} 50%{transform:scaleX(0.96) scaleY(1.07) translateY(-5px) rotate(1.5deg)} 100%{transform:scaleX(1) scaleY(1) rotate(0deg)} }
.fire-embers-bg { position:absolute; inset:0; overflow:hidden; }
.fire-ember-bg { position:absolute; border-radius:50%; background:radial-gradient(circle,rgba(255,200,50,0.9),rgba(255,80,10,0.4) 50%,transparent); animation:emberBg linear infinite; }
@keyframes emberBg { 0%{transform:translateY(0) translateX(0);opacity:0} 5%{opacity:1} 80%{opacity:0.5} 100%{transform:translateY(var(--t)) translateX(var(--s));opacity:0} }
.fire-heat { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 100%,rgba(255,60,5,0.12) 0%,rgba(180,20,2,0.05) 40%,transparent 70%); animation:heatWave 1.5s ease-in-out infinite alternate; }
@keyframes heatWave { 0%{opacity:0.6;transform:scaleX(0.98)} 100%{opacity:1;transform:scaleX(1.02)} }

/* ── EARTH BG ── */
.bg-earth { position:absolute; inset:0; display:none; }
.active-earth .bg-earth { display:block; }
.earth-dark { position:absolute; inset:0; background:linear-gradient(180deg,#040a02 0%,#081204 20%,#0c1a08 45%,#10220c 70%,#142a10 100%); }
.earth-moon { position:absolute; top:-5%; right:10%; width:30vw; height:30vw; background:radial-gradient(circle,rgba(80,200,40,0.1) 0%,rgba(50,160,20,0.05) 40%,transparent 65%); filter:blur(30px); animation:moonGlow 7s ease-in-out infinite; }
@keyframes moonGlow { 0%,100%{opacity:0.6;transform:scale(1)} 50%{opacity:1;transform:scale(1.12)} }
.earth-bio { position:absolute; inset:0; overflow:hidden; }
.earth-bio-glow { position:absolute; border-radius:50%; animation:bioGlow ease-in-out infinite; }
@keyframes bioGlow { 0%,100%{opacity:0.2;transform:scale(1)} 50%{opacity:0.55;transform:scale(1.2)} }
.earth-mist { position:absolute; bottom:0; left:0; right:0; height:35%; background:linear-gradient(0deg,rgba(10,40,5,0.5) 0%,rgba(15,50,8,0.2) 50%,transparent 100%); animation:mistShift 10s ease-in-out infinite; }
@keyframes mistShift { 0%,100%{transform:scaleX(1) translateY(0);opacity:0.7} 50%{transform:scaleX(1.02) translateY(-3px);opacity:1} }
.earth-spores-bg { position:absolute; inset:0; overflow:hidden; }
.earth-spore-bg { position:absolute; border-radius:50%; background:radial-gradient(circle,rgba(120,230,70,0.85),rgba(60,170,30,0.3) 50%,transparent); animation:sporeBg linear infinite; }
@keyframes sporeBg { 0%{transform:translateY(0) translateX(0) scale(0.4);opacity:0} 8%{opacity:0.8} 85%{opacity:0.2} 100%{transform:translateY(var(--t)) translateX(var(--s)) scale(1.1);opacity:0} }

/* DEFAULT (пока не определена стихия) */
.bg-default { position:absolute; inset:0; background:linear-gradient(160deg,#03050f 0%,#050810 40%,#070c18 100%); }

/* Vignette */
.bg-vignette { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(0,0,0,0.4) 100%); pointer-events:none; }

.stars { position:fixed; inset:0; z-index:0; pointer-events:none; }
.star { position:absolute; border-radius:50%; background:white; animation:twinkle ease-in-out infinite; }
@keyframes twinkle { 0%,100%{opacity:0.05} 50%{opacity:0.4} }
.grain { position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity:0.4; mix-blend-mode:screen; }

.header { position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between;
    padding:1.2rem 2.5rem; background:rgba(5,5,10,0.72); backdrop-filter:blur(24px);
    border-bottom:1px solid rgba(255,255,255,0.05); }
.logo-btn { font-family:'Unbounded',sans-serif; font-weight:200; font-size:0.72rem; letter-spacing:0.45em;
    text-transform:uppercase; color:rgba(255,255,255,0.4); text-decoration:none; transition:color 0.3s; }
.logo-btn:hover { color:rgba(255,255,255,0.8); }
.header-right { display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap; }
.btn-ghost { font-family:'DM Mono',monospace; font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase;
    padding:0.5rem 1.1rem; background:transparent; color:rgba(255,255,255,0.4);
    border:1px solid rgba(255,255,255,0.1); border-radius:9999px; cursor:pointer; transition:all 0.3s; text-decoration:none; display:inline-block; }
.btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,0.25); }
.btn-primary { font-family:'DM Mono',monospace; font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase;
    padding:0.5rem 1.1rem; background:rgba(255,255,255,0.9); color:#05050a;
    border:none; border-radius:9999px; cursor:pointer; transition:all 0.3s; }
.btn-primary:hover { background:#fff; transform:translateY(-1px); }

.main { position:relative; z-index:10; max-width:1100px; margin:0 auto; padding:3rem 2.5rem 6rem; }

/* IDENTITY */
.identity { display:flex; align-items:flex-start; gap:2.5rem; margin-bottom:4rem;
    animation:fadeUp 1.4s cubic-bezier(0.16,1,0.3,1) 0.3s both; }
.avatar-wrap { position:relative; flex-shrink:0; width:100px; height:100px; }
.avatar-orb { width:100px; height:100px; border-radius:50%; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:'Unbounded',sans-serif; font-weight:200; font-size:2rem; color:#fff;
    position:relative; z-index:2; cursor:pointer;
    transition:transform 0.4s cubic-bezier(0.16,1,0.3,1); }
.avatar-orb:hover { transform:scale(1.05); }
.avatar-orb img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.avatar-glow { position:absolute; inset:-8px; border-radius:50%; animation:avatarPulse 4s ease-in-out infinite; z-index:1; filter:blur(12px); opacity:0.45; }
@keyframes avatarPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
.avatar-upload-btn { position:absolute; bottom:0; right:0; z-index:3;
    width:28px; height:28px; border-radius:50%; border:2px solid rgba(5,5,10,0.8);
    background:rgba(255,255,255,0.9); display:none; align-items:center; justify-content:center;
    cursor:pointer; transition:all 0.2s; font-size:0.75rem; color:#05050a; }
.avatar-upload-btn:hover { background:#fff; transform:scale(1.1); }

.identity-info { flex:1; padding-top:0.5rem; }
.profile-name { font-size:clamp(1.8rem,3.5vw,2.8rem); font-weight:300; line-height:1.1; color:#fff; margin-bottom:0.3rem; }
.profile-handle { font-family:'DM Mono',monospace; font-size:0.62rem; letter-spacing:0.15em;
    color:rgba(255,255,255,0.22); text-transform:uppercase; margin-bottom:0.75rem; }
.dominant-pill { display:none; align-items:center; gap:0.5rem; padding:0.28rem 0.85rem;
    border-radius:9999px; font-family:'DM Mono',monospace; font-size:0.52rem; letter-spacing:0.12em;
    text-transform:uppercase; margin-bottom:0.85rem; border:1px solid; width:fit-content; }
.dominant-dot { width:5px; height:5px; border-radius:50%; animation:dotPulse 2.5s ease-in-out infinite; }
@keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:0.4;transform:scale(1.3)} }
.profile-bio { font-size:0.95rem; color:rgba(255,255,255,0.42); line-height:1.7; max-width:420px; font-style:italic; margin-bottom:1rem; }
.profile-bio-empty { font-size:0.85rem; color:rgba(255,255,255,0.18); font-style:italic; margin-bottom:1rem; cursor:pointer; transition:color 0.2s; }
.profile-bio-empty:hover { color:rgba(255,255,255,0.38); }
.bio-edit-wrap { display:none; margin-bottom:1rem; }
.bio-edit-wrap.open { display:block; }
.bio-input { width:100%; max-width:420px; padding:0.7rem 1rem; background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12); border-radius:0.75rem; color:#fff;
    font-family:'Cormorant Garamond',serif; font-size:0.95rem; font-style:italic;
    outline:none; resize:none; line-height:1.7; transition:border-color 0.3s; }
.bio-input:focus { border-color:rgba(255,255,255,0.28); }
.bio-input::placeholder { color:rgba(255,255,255,0.2); }
.bio-save-row { display:flex; gap:0.5rem; margin-top:0.5rem; }
.profile-stats { display:flex; gap:2rem; }
.stat-val { font-family:'Cormorant Garamond',serif; font-size:1.8rem; font-weight:300; color:#fff; display:block; line-height:1; }
.stat-label { font-family:'DM Mono',monospace; font-size:0.52rem; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.2); margin-top:0.2rem; display:block; }
.identity-actions { display:flex; flex-direction:column; gap:0.6rem; align-items:flex-end; padding-top:0.5rem; flex-shrink:0; }

/* SECTION LABEL */
.section-label { font-family:'DM Mono',monospace; font-size:0.58rem; letter-spacing:0.25em; text-transform:uppercase;
    color:rgba(255,255,255,0.18); margin-bottom:1.75rem; display:flex; align-items:center; gap:1rem; }
.section-label::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.06); }

/* ── COVER — кинематический переход ── */
#cover { position:fixed; inset:0; z-index:999; opacity:0; pointer-events:none;
    transition:opacity 1.1s cubic-bezier(0.4,0,0.2,1); }

/* ── AIR RAYS — для воздушного фона ── */
.air-rays { position:absolute; bottom:0; left:0; right:0; height:75%; overflow:hidden; }
.air-ray { position:absolute; bottom:0; width:2px; transform-origin:bottom center;
    background:linear-gradient(0deg,rgba(220,180,80,0.3) 0%,rgba(255,230,140,0.08) 60%,transparent 100%);
    filter:blur(3px); animation:rayWave ease-in-out infinite; }
.air-ray:nth-child(1){left:15%;height:65%;animation-duration:8s;opacity:0.7;width:60px}
.air-ray:nth-child(2){left:32%;height:50%;animation-duration:11s;animation-delay:-3s;opacity:0.5;width:40px}
.air-ray:nth-child(3){left:52%;height:70%;animation-duration:9s;animation-delay:-5s;opacity:0.6;width:80px}
.air-ray:nth-child(4){left:70%;height:45%;animation-duration:13s;animation-delay:-1.5s;opacity:0.4;width:35px}
.air-ray:nth-child(5){left:84%;height:55%;animation-duration:7s;animation-delay:-7s;opacity:0.5;width:55px}
@keyframes rayWave { 0%,100%{transform:skewX(0deg) scaleX(1)} 33%{transform:skewX(4deg) scaleX(0.82)} 66%{transform:skewX(-3deg) scaleX(1.15)} }

/* ── ORBS — как на stihii.html ── */
.elements-orbs { display:flex; gap:3rem; justify-content:flex-start; flex-wrap:wrap;
    margin-bottom:4rem; animation:fadeUp 1.4s cubic-bezier(0.16,1,0.3,1) 0.5s both; }

.orb-item { display:flex; flex-direction:column; align-items:center; gap:1rem;
    cursor:pointer; transition:transform 0.5s cubic-bezier(0.16,1,0.3,1); position:relative; }
.orb-item:hover { transform:translateY(-10px); }

.orb-wrap { position:relative; }
.orb { border-radius:50%; position:relative; overflow:hidden; flex-shrink:0;
    transition:transform 0.6s cubic-bezier(0.16,1,0.3,1); }
.orb-item:hover .orb { transform:scale(1.06); }
.orb-item.dominant .orb-wrap .orb { width:130px; height:130px; }
.orb-item:not(.dominant) .orb { width:108px; height:108px; }

/* ── ШАР ВОДЫ ── */
.o-water {
    background:
        radial-gradient(ellipse 70% 50% at 35% 25%, rgba(160,230,255,0.45) 0%, transparent 55%),
        radial-gradient(ellipse 80% 60% at 60% 55%, rgba(30,120,220,0.6) 0%, transparent 65%),
        radial-gradient(ellipse at 50% 50%, #0c2850 0%, #081c3a 40%, #040e20 100%);
    animation:wMorph 8s ease-in-out infinite, wGlow 4s ease-in-out infinite;
    box-shadow:0 0 50px rgba(40,130,255,0.35),0 0 100px rgba(20,90,200,0.18),inset 0 25px 50px rgba(120,220,255,0.18),inset 0 -15px 40px rgba(10,50,150,0.5);
}
@keyframes wMorph {
    0%,100%{border-radius:62% 38% 55% 45%/48% 52% 48% 52%}
    25%{border-radius:50% 50% 45% 55%/55% 45% 58% 42%}
    50%{border-radius:40% 60% 60% 40%/45% 55% 45% 55%}
    75%{border-radius:58% 42% 48% 52%/52% 48% 55% 45%}
}
@keyframes wGlow {

                <textarea class="bio-input" id="bio-input" rows="2" placeholder="Несколько слов о себе..."></textarea>

                <div><span class="stat-val" id="stat-collections">—</span><span class="stat-label">коллекций</span></div>

    <div class="modal">
        <div class="modal-title">Пригласить друга</div>

            <button class="btn-primary" onclick="copyInviteLink()">Копировать</button>

    </div>
</div>

<script type="module">
import { supabase, getCurrentUser } from './js/supabase-client.js'

const ELEMENT_CONFIG = {
    water: { name:'Вода',   url:'water.html',  cls:'ow', orbCls:'o-water', accent:'#78c8e8', bgClass:'active-water', pillBg:'rgba(120,200,232,0.1)',  pillBorder:'rgba(120,200,232,0.28)' },
    air:   { name:'Воздух', url:'air.html',    cls:'oa', orbCls:'o-air',   accent:'#c8a860', bgClass:'active-air',   pillBg:'rgba(200,168,96,0.1)',   pillBorder:'rgba(200,168,96,0.28)' },
    fire:  { name:'Огонь',  url:'fire.html',   cls:'of', orbCls:'o-fire',  accent:'#e87840', bgClass:'active-fire',  pillBg:'rgba(232,120,64,0.1)',   pillBorder:'rgba(232,120,64,0.28)' },
    earth: { name:'Земля',  url:'earth.html',  cls:'oe', orbCls:'o-earth', accent:'#78b048', bgClass:'active-earth', pillBg:'rgba(120,176,72,0.1)',   pillBorder:'rgba(120,176,72,0.28)' },
}
const AVATAR_BG = {
    water:'linear-gradient(135deg,#0b2448,#1a6090)',
    air:  'linear-gradient(135deg,#06040e,#c8a860)',
    fire: 'linear-gradient(135deg,#3a0a02,#c04020)',
    earth:'linear-gradient(135deg,#0a1804,#3a7820)',
}

let currentUser = null
let profileUser = null
let isOwnProfile = true
let userTier = 'seeker'

// Stars
const sc = document.getElementById('stars')
for (let i = 0; i < 110; i++) {
    const s = document.createElement('div'); s.className = 'star'
    const sz = 0.6 + Math.random() * 1.7
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2.5+Math.random()*5}s;animation-delay:-${Math.random()*7}s;`
    sc.appendChild(s)
}

function toast(msg, type='') {
    const a = document.getElementById('toast-area')
    const d = document.createElement('div'); d.className = 'toast '+type; d.textContent = msg
    a.appendChild(d); setTimeout(() => d.remove(), 3500)
}

// ── ЖИВЫЕ ЧАСТИЦЫ ФОНА ──
function spawnBgParticles(el) {
    if (el === 'water') {
        const c = document.getElementById('water-particles')
        for (let i = 0; i < 18; i++) {
            const p = document.createElement('div'); p.className = 'water-p'
            const sz = 2 + Math.random() * 5
            p.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:${Math.random()*60}%;--t:${-(60+Math.random()*150)}px;--s:${(Math.random()-.5)*50}px;animation-duration:${5+Math.random()*8}s;animation-delay:-${Math.random()*10}s;`
            c.appendChild(p)
        }
    } else if (el === 'air') {
        const c = document.getElementById('air-motes')
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div'); p.className = 'air-mote-bg'
            const sz = 2 + Math.random() * 4
            p.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;--sy:${60+Math.random()*30}vh;--ey:${-(10+Math.random()*30)}vh;--s:${(Math.random()-.5)*60}px;animation-duration:${7+Math.random()*10}s;animation-delay:-${Math.random()*12}s;`
            c.appendChild(p)
        }
    } else if (el === 'fire') {
        const c = document.getElementById('fire-embers')
        for (let i = 0; i < 22; i++) {
            const p = document.createElement('div'); p.className = 'fire-ember-bg'
            const sz = 1.5 + Math.random() * 3.5
            p.style.cssText = `width:${sz}px;height:${sz}px;left:${20+Math.random()*60}%;bottom:${Math.random()*25}%;--t:${-(80+Math.random()*200)}px;--s:${(Math.random()-.5)*80}px;animation-duration:${2+Math.random()*4}s;animation-delay:-${Math.random()*5}s;`
            c.appendChild(p)
        }
    } else if (el === 'earth') {
        // Споры
        const sc2 = document.getElementById('earth-spores')
        for (let i = 0; i < 14; i++) {
            const p = document.createElement('div'); p.className = 'earth-spore-bg'
            const sz = 2 + Math.random() * 4
            p.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:${Math.random()*50}%;--t:${-(50+Math.random()*120)}px;--s:${(Math.random()-.5)*40}px;animation-duration:${4+Math.random()*7}s;animation-delay:-${Math.random()*9}s;`
            sc2.appendChild(p)
        }
        // Биолюминесцентные пятна
        const bc = document.getElementById('earth-bio')
        const spots = [[20,55],[55,68],[78,45],[38,75],[65,38],[15,30],[85,60]]
        spots.forEach(([x,y]) => {
            const g = document.createElement('div'); g.className = 'earth-bio-glow'
            const sz = 50 + Math.random() * 80
            const dur = 3 + Math.random() * 4
            g.style.cssText = `width:${sz}px;height:${sz}px;left:${x}%;top:${y}%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(80,200,40,0.18),transparent 70%);animation-duration:${dur}s;animation-delay:-${Math.random()*5}s;`
            bc.appendChild(g)
        })
    }
}

// Частицы вокруг шара
function spawnOrbParticles(el, container) {
    const cfgs = {
        water:{ n:10, color:'rgba(120,210,255,0.8)', min:1.5, max:4 },
        air:  { n:10, color:'rgba(210,175,80,0.8)',  min:1, max:3 },
        fire: { n:12, color:'rgba(255,180,50,0.9)',  min:1.5, max:3.5 },
        earth:{ n:8,  color:'rgba(110,210,60,0.8)',  min:2, max:4 },
    }
    const cfg = cfgs[el]; if (!cfg) return
    for (let i = 0; i < cfg.n; i++) {
        const p = document.createElement('div'); p.className = 'orb-p'
        const sz = cfg.min + Math.random() * (cfg.max - cfg.min)
        const angle = Math.random() * Math.PI * 2
        const radius = 40 + Math.random() * 30
        p.style.cssText = `
            width:${sz}px;height:${sz}px;
            left:${50 + Math.cos(angle)*40}%;
            bottom:${20 + Math.random()*30}%;
            background:radial-gradient(circle,${cfg.color},transparent 70%);
            --t:${-(40+Math.random()*80)}px;
            --s:${(Math.random()-.5)*50}px;
            animation-duration:${3+Math.random()*5}s;
            animation-delay:-${Math.random()*7}s;
        `
        container.appendChild(p)
    }
}

// INIT
;(async () => {
    const user = await getCurrentUser()
    if (!user) { window.location.href = 'login.html'; return }
    currentUser = user
    userTier = user.profile?.tier || 'seeker'

    const params = new URLSearchParams(window.location.search)
    const inviteToken = params.get('invite')
    const viewNick = params.get('user')

    if (inviteToken) { await handleInvite(inviteToken); return }

    if (viewNick && viewNick.toLowerCase() !== user.profile?.nickname?.toLowerCase()) {
        isOwnProfile = false
        const { data: fp } = await supabase.from('profiles').select('*').eq('nickname', viewNick).single()
        if (!fp) { toast('Пользователь не найден', 'error'); return }
        profileUser = fp
    } else {
        profileUser = user.profile
    }

    await loadProfile()
})()

async function loadProfile() {
    const uid = profileUser.id
    document.getElementById('name-text').textContent = profileUser.nickname || '?'
    document.getElementById('profile-handle').textContent = `@${profileUser.nickname || '?'}`
    document.title = `БУДУМ — ${profileUser.nickname}`

    // Bio
    if (profileUser.bio) {
        document.getElementById('profile-bio').textContent = profileUser.bio
        document.getElementById('profile-bio').style.display = ''
    } else if (isOwnProfile) {
        document.getElementById('bio-empty').style.display = ''
    }

    // Avatar
    const orb = document.getElementById('avatar-orb')
    if (profileUser.avatar_url) {
        orb.innerHTML = `<img src="${profileUser.avatar_url}" alt="avatar">`
        orb.style.background = 'transparent'
    } else {
        const el = profileUser.element || 'water'
        orb.textContent = (profileUser.nickname || '?').charAt(0).toUpperCase()
        orb.style.background = AVATAR_BG[el]
        document.getElementById('avatar-glow').style.background = AVATAR_BG[el]
    }
    if (isOwnProfile) {
        const btn = document.getElementById('avatar-upload-btn')
        btn.style.display = 'flex'
        document.getElementById('avatar-file-input').addEventListener('change', uploadAvatar)
    }

    // Collections
    const { data: cols } = await supabase.from('collections').select('*, materials(count)').eq('user_id', uid)
    const allCols = cols || []
    const counts = { water:0, air:0, fire:0, earth:0 }
    let totalMats = 0
    allCols.forEach(c => {
        if (counts[c.element] !== undefined) counts[c.element]++
        totalMats += c.materials?.[0]?.count || 0
    })
    const visibleCols = isOwnProfile ? allCols : allCols.filter(c => c.is_public)
    document.getElementById('stat-collections').textContent = visibleCols.length
    document.getElementById('stat-materials').textContent = totalMats

    // Dominant element
    const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1])
    const dominant = sorted[0]
    if (dominant && dominant[1] > 0) applyDominantTheme(dominant[0])

    // Orbs
    renderOrbs(counts)

    // Header
    renderHeader()

    // Friends
    await loadFriends(uid)
}

function applyDominantTheme(el) {
    const cfg = ELEMENT_CONFIG[el]; if (!cfg) return
    // Активируем живой фон
    const bgLayer = document.getElementById('bg-layer')
    bgLayer.className = `bg-layer ${cfg.bgClass}`
    document.getElementById('bg-default').style.display = 'none'
    // Частицы фона
    spawnBgParticles(el)

    const pill = document.getElementById('dominant-pill')
    pill.style.display = 'flex'
    pill.style.background = cfg.pillBg
    pill.style.borderColor = cfg.pillBorder
    pill.style.color = cfg.accent
    pill.innerHTML = `<div class="dominant-dot" style="background:${cfg.accent}"></div>Доминирует ${cfg.name}`
    if (!profileUser.avatar_url) {
        document.getElementById('avatar-glow').style.background = AVATAR_BG[el]
    }
}

// ── КИНЕМАТИЧЕСКИЙ ПЕРЕХОД ──
function navigateWithCover(url) {
    const cv = document.getElementById('cover')
    // определяем цвет по URL
    const colors = { 'water':'#030c18', 'air':'#06040e', 'fire':'#0a0200', 'earth':'#040a02' }
    const key = Object.keys(colors).find(k => url.includes(k)) || '#030c18'
    cv.style.background = colors[key]
    cv.style.pointerEvents = 'all'
    cv.style.opacity = '1'
    setTimeout(() => { window.location.href = url }, 1150)
}

function renderOrbs(counts) {
    const wrap = document.getElementById('elements-orbs')
    wrap.innerHTML = ''
    const maxCount = Math.max(...Object.values(counts))
    Object.entries(ELEMENT_CONFIG).forEach(([key, cfg]) => {
        const count = counts[key] || 0
        const isDominant = count > 0 && count === maxCount
        const item = document.createElement('div')
        item.className = `orb-item ${cfg.cls}${isDominant ? ' dominant' : ''}`

        // При клике: свой → своя стихия, чужой → стихия с ?view=nickname
        item.onclick = () => {
            const url = isOwnProfile ? cfg.url : `${cfg.url}?view=${encodeURIComponent(profileUser.nickname)}`
            // Анимируем шар
            const orb = item.querySelector('.orb')
            if (orb) { orb.style.transition = 'transform 0.35s cubic-bezier(0.16,1,0.3,1)'; orb.style.transform = 'scale(1.12) translateY(-6px)' }
            setTimeout(() => navigateWithCover(url), 250)
        }

        // Внутренности шара по типу
        const inner = {
            water: `<div class="o-water-pts" id="owp-${key}"></div>`,
            air:   `<div class="o-air-clouds"><div class="oc"></div><div class="oc"></div><div class="oc"></div></div><div class="o-air-motes" id="oam-${key}"></div>`,
            fire:  `<div class="o-fire-pts" id="ofp-${key}"></div>`,
            earth: `<div class="o-earth-pts" id="oep-${key}"></div>`,
        }

        item.innerHTML = `
            <div class="orb-wrap">
                <div class="orb ${cfg.orbCls}">
                    ${inner[key] || ''}
                    ${count > 0 ? `<div class="orb-count">${count}</div>` : ''}
                </div>
                <div class="orb-particles" id="op-${key}"></div>
            </div>
            <div class="orb-name">${cfg.name}</div>
        `
        wrap.appendChild(item)
        spawnOrbParticles(key, document.getElementById(`op-${key}`))

        // Спавним частицы внутри шара
        spawnInnerOrbParticles(key)
    })
}

function spawnInnerOrbParticles(key) {
    if (key === 'water') {
        const c = document.getElementById(`owp-water`)
        if (!c) return
        for (let i = 0; i < 16; i++) {
            const p = document.createElement('div'); p.className = 'wp2'
            const sz = 2 + Math.random() * 6
            p.style.cssText = `width:${sz}px;height:${sz}px;left:${10+Math.random()*80}%;bottom:${5+Math.random()*30}%;--t:${-(60+Math.random()*80)}px;--s:${(Math.random()-.5)*30}px;animation-duration:${3+Math.random()*4}s;animation-delay:-${Math.random()*6}s;`
            c.appendChild(p)
        }
    } else if (key === 'air') {
        const c = document.getElementById(`oam-air`)
        if (!c) return
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div'); p.className = 'om'
            const sz = 1.5 + Math.random() * 4
            p.style.cssText = `width:${sz}px;height:${sz}px;left:${5+Math.random()*90}%;bottom:0;--sy:${(10+Math.random()*40)}px;--ey:${-(50+Math.random()*80)}px;--s:${(Math.random()-.5)*40}px;animation-duration:${3.5+Math.random()*5}s;animation-delay:-${Math.random()*7}s;`
            c.appendChild(p)
        }
    } else if (key === 'fire') {
        const c = document.getElementById(`ofp-fire`)
        if (!c) return
        for (let i = 0; i < 24; i++) {
            const p = document.createElement('div'); p.className = 'ofp'
            const sz = 1.5 + Math.random() * 4
            p.style.cssText = `width:${sz}px;height:${sz}px;left:${20+Math.random()*60}%;bottom:${Math.random()*20}%;--t:${-(70+Math.random()*100)}px;--s:${(Math.random()-.5)*50}px;animation-duration:${1.5+Math.random()*2.5}s;animation-delay:-${Math.random()*4}s;`
            c.appendChild(p)
        }
    } else if (key === 'earth') {
        const c = document.getElementById(`oep-earth`)
        if (!c) return
        for (let i = 0; i < 14; i++) {
            const p = document.createElement('div'); p.className = 'oep'
            const sz = 2 + Math.random() * 5
            p.style.cssText = `width:${sz}px;height:${sz}px;left:${10+Math.random()*80}%;bottom:${10+Math.random()*35}%;--t:${-(60+Math.random()*90)}px;--s:${(Math.random()-.5)*28}px;animation-duration:${5+Math.random()*5}s;animation-delay:-${Math.random()*8}s;`
            c.appendChild(p)
        }
    }
}

function renderHeader() {
    const ha = document.getElementById('header-actions')
    if (isOwnProfile) {
        ha.innerHTML = `
            ${userTier === 'keeper' ? '<button class="btn-ghost" onclick="openInviteModal()">Пригласить друга</button>' : '<button class="btn-primary" onclick="window.location.href=\'subscribe.html\'">Стать Хранителем</button>'}
            <a href="stihii.html" class="btn-ghost">Стихии</a>
            <button class="btn-ghost" onclick="doLogout()">Выйти</button>
        `
    } else {
        ha.innerHTML = `<a href="stihii.html" class="btn-ghost">← Стихии</a>`
        if (userTier === 'keeper') {
            const btn = document.createElement('button')
            btn.className = 'btn-ghost'
            btn.id = 'friend-btn'
            btn.textContent = '...'
            ha.prepend(btn)
            checkFriendship()
        }
    }
}

async function loadFriends(uid) {
    const section = document.getElementById('friends-section')
    const list = document.getElementById('friends-list')

    const { data: fs } = await supabase.from('friendships').select('user_from,user_to')
        .eq('status','accepted').or(`user_from.eq.${uid},user_to.eq.${uid}`)

    if (!fs?.length) {
        if (isOwnProfile) {
            section.style.display = ''
            list.innerHTML = `<div class="friends-hidden">Пока нет друзей — <span style="cursor:pointer;color:rgba(255,255,255,0.45)" onclick="openInviteModal()">пригласи первого →</span></div>`
        }
        return
    }

    section.style.display = ''

    if (!isOwnProfile && profileUser.show_friends === false) {
        list.innerHTML = `<div class="friends-hidden">Список друзей скрыт</div>`
        return
    }

    const friendIds = fs.map(f => f.user_from === uid ? f.user_to : f.user_from).filter(Boolean)
    const { data: profiles } = await supabase.from('profiles').select('id,nickname,element,avatar_url').in('id', friendIds)

    const grid = document.createElement('div'); grid.className = 'friends-grid'
    ;(profiles || []).forEach(p => {
        const chip = document.createElement('a')
        chip.className = 'friend-chip'
        chip.href = `profile.html?user=${p.nickname}`
        const el = p.element || 'water'
        chip.innerHTML = p.avatar_url
            ? `<img src="${p.avatar_url}" style="width:1.6rem;height:1.6rem;border-radius:50%;object-fit:cover;flex-shrink:0"><div class="friend-chip-name">${p.nickname}</div>`
            : `<div class="friend-chip-avatar" style="background:${AVATAR_BG[el]}">${p.nickname.charAt(0).toUpperCase()}</div><div class="friend-chip-name">${p.nickname}</div>`
        grid.appendChild(chip)
    })
    list.appendChild(grid)

    if (isOwnProfile) {
        const row = document.createElement('div'); row.className = 'visibility-row'
        const checked = profileUser.show_friends !== false
        row.innerHTML = `
            <span class="visibility-label" id="vis-label">${checked ? 'Список виден друзьям' : 'Список скрыт'}</span>
            <label class="toggle">
                <input type="checkbox" id="show-friends-toggle" ${checked ? 'checked' : ''}>
                <span class="toggle-slider"></span>
            </label>
        `
        list.appendChild(row)
        document.getElementById('show-friends-toggle').addEventListener('change', toggleFriendsVisibility)
    }
}

async function checkFriendship() {
    const btn = document.getElementById('friend-btn'); if (!btn) return
    const { data: fs } = await supabase.from('friendships').select('id')
        .eq('status','accepted')
        .or(`and(user_from.eq.${currentUser.id},user_to.eq.${profileUser.id}),and(user_from.eq.${profileUser.id},user_to.eq.${currentUser.id})`)
    if (fs?.length) {
        btn.textContent = '◎ Вы друзья'; btn.style.opacity = '0.6'
    } else {
        btn.textContent = 'Добавить в друзья →'
        btn.onclick = openInviteModal
    }
}

window.toggleFriendsVisibility = async function() {
    const show = document.getElementById('show-friends-toggle').checked
    document.getElementById('vis-label').textContent = show ? 'Список виден друзьям' : 'Список скрыт'
    await supabase.from('profiles').update({ show_friends: show }).eq('id', currentUser.id)
    profileUser.show_friends = show
    toast(show ? 'Список друзей открыт' : 'Список друзей скрыт', 'success')
}

window.openBioEdit = function() {
    document.getElementById('bio-edit-wrap').classList.add('open')
    document.getElementById('bio-input').value = profileUser.bio || ''
    document.getElementById('bio-empty').style.display = 'none'
    document.getElementById('profile-bio').style.display = 'none'
}
window.closeBioEdit = function() {
    document.getElementById('bio-edit-wrap').classList.remove('open')
    if (profileUser.bio) document.getElementById('profile-bio').style.display = ''
    else document.getElementById('bio-empty').style.display = ''
}
window.saveBio = async function() {
    const bio = document.getElementById('bio-input').value.trim()
    const { error } = await supabase.from('profiles').update({ bio }).eq('id', currentUser.id)
    if (error) { toast('Ошибка сохранения', 'error'); return }
    profileUser.bio = bio
    if (bio) { document.getElementById('profile-bio').textContent = bio; document.getElementById('profile-bio').style.display = ''; document.getElementById('bio-empty').style.display = 'none'; }
    else { document.getElementById('profile-bio').style.display = 'none'; document.getElementById('bio-empty').style.display = ''; }
    closeBioEdit(); toast('Bio сохранено ◎', 'success')
}

async function uploadAvatar(e) {
    const file = e.target.files?.[0]; if (!file) return
    if (file.size > 2 * 1024 * 1024) { toast('Макс 2MB', 'error'); return }
    toast('Загружаем...')
    const ext = file.name.split('.').pop()
    const path = `${currentUser.id}/avatar.${ext}`
    const { error: upErr } = await supabase.storage.from('avatars').upload(path, file, { upsert:true })
    if (upErr) { toast('Ошибка: ' + upErr.message, 'error'); return }
    const { data: urlData } = supabase.storage.from('avatars').getPublicUrl(path)
    const url = urlData.publicUrl + '?t=' + Date.now()
    await supabase.from('profiles').update({ avatar_url: url }).eq('id', currentUser.id)
    profileUser.avatar_url = url
    const orb = document.getElementById('avatar-orb')
    orb.innerHTML = `<img src="${url}" alt="avatar">`
    orb.style.background = 'transparent'
    toast('Аватарка обновлена ◎', 'success')
}

window.openInviteModal = async function() {
    const token = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('')
    await supabase.from('friendships').insert({ user_from: currentUser.id, user_to: null, token, status: 'pending' })
    const base = window.location.href.split('?')[0].split('#')[0]
    document.getElementById('invite-link-input').value = `${base}?invite=${token}`
    document.getElementById('invite-modal').classList.add('open')
}
window.closeInviteModal = () => document.getElementById('invite-modal').classList.remove('open')
window.copyInviteLink = function() {
    navigator.clipboard.writeText(document.getElementById('invite-link-input').value)
    toast('Ссылка скопирована ◎', 'success')
}

async function handleInvite(token) {
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) { window.location.href = `login.html?next=${encodeURIComponent(window.location.href)}`; return }
    const { data: invite } = await supabase.from('friendships').select('*').eq('token', token).eq('status','pending').single()
    if (!invite) { toast('Ссылка недействительна', 'error'); profileUser = currentUser.profile; await loadProfile(); return }
    if (invite.user_from === session.user.id) { toast('Это твоя ссылка', 'error'); profileUser = currentUser.profile; await loadProfile(); return }
    await supabase.from('friendships').update({ user_to: session.user.id, status: 'accepted' }).eq('id', invite.id)
    const mt = Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b=>b.toString(16).padStart(2,'0')).join('')
    await supabase.from('friendships').insert({ user_from: session.user.id, user_to: invite.user_from, token: mt, status: 'accepted' })
    toast('Вы теперь друзья! ◎', 'success')
    const { data: fp } = await supabase.from('profiles').select('*').eq('id', invite.user_from).single()
    profileUser = fp || currentUser.profile; isOwnProfile = !fp
    await loadProfile()
}

window.doLogout = async function() {
    await supabase.auth.signOut()
    window.location.href = 'login.html'
}
</script>
