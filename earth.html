<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БУДУМ — Земля</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Unbounded:wght@200;300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
    --ease: cubic-bezier(0.16,1,0.3,1);
    --accent: #78b048;
    --accent-2: rgba(120,176,72,0.18);
    --accent-3: rgba(120,176,72,0.07);
}
html, body { width:100%; min-height:100%; background:#040a02; font-family:'Cormorant Garamond',serif; color:#f0ece4; overflow-x:hidden; }

/* ── BACKGROUND ── */
.bg-layer { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.earth-deep {
    position:absolute; inset:0;
    background: linear-gradient(180deg, #020601 0%, #040a02 20%, #060e03 40%, #081204 60%, #0a1605 80%, #0c1a06 100%);
}
.earth-glow-1 {
    position:absolute; bottom:-15%; left:25%; width:60vw; height:40vw;
    background:radial-gradient(ellipse, rgba(60,160,30,0.2) 0%, rgba(40,120,20,0.08) 45%, transparent 70%);
    filter:blur(40px); animation:bioGlow 5s ease-in-out infinite alternate;
}
.earth-glow-2 {
    position:absolute; top:10%; right:10%; width:40vw; height:30vw;
    background:radial-gradient(ellipse, rgba(80,180,40,0.12) 0%, transparent 65%);
    filter:blur(35px); animation:bioGlow 7s ease-in-out infinite alternate-reverse;
}
.earth-glow-3 {
    position:absolute; top:40%; left:5%; width:35vw; height:25vw;
    background:radial-gradient(ellipse, rgba(50,140,25,0.1) 0%, transparent 65%);
    filter:blur(30px); animation:bioGlow 6s ease-in-out 2s infinite alternate;
}
@keyframes bioGlow { 0%{opacity:0.5;transform:scale(1)} 100%{opacity:1;transform:scale(1.12)} }
.earth-particles { position:absolute; inset:0; overflow:hidden; }
.grain { position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity:0.45; mix-blend-mode:screen; }

/* ── HEADER ── */
.header { position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between;
    padding:1.2rem 2.5rem; background:rgba(4,10,2,0.75); backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(120,176,72,0.08); animation:fadeDown 1.2s var(--ease) 0.2s both; }
.header-left { display:flex; align-items:center; gap:1.5rem; }
.logo-btn { font-family:'Unbounded',sans-serif; font-weight:200; font-size:0.72rem; letter-spacing:0.45em;
    text-transform:uppercase; color:rgba(255,255,255,0.4); text-decoration:none; transition:color 0.3s; }
.logo-btn:hover { color:rgba(255,255,255,0.8); }
.element-pill { display:flex; align-items:center; gap:0.5rem; padding:0.3rem 0.9rem;
    border:1px solid var(--accent-2); border-radius:9999px; background:var(--accent-3); cursor:pointer; transition:all 0.3s; }
.element-pill:hover { background:var(--accent-2); }
.element-pill-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); animation:dotPulse 2.5s ease-in-out infinite; }
@keyframes dotPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.4);opacity:0.7} }
.element-pill-name { font-family:'DM Mono',monospace; font-size:0.6rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--accent); }
.header-right { display:flex; align-items:center; gap:1rem; }
.btn-primary { font-family:'DM Mono',monospace; font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase;
    padding:0.55rem 1.3rem; background:var(--accent); color:#05050a; border:none; border-radius:9999px; cursor:pointer; transition:all 0.3s var(--ease); }
.btn-primary:hover { transform:translateY(-2px); filter:brightness(1.12); }
.btn-ghost { font-family:'DM Mono',monospace; font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase;
    padding:0.5rem 1.1rem; background:transparent; color:rgba(255,255,255,0.4);
    border:1px solid rgba(255,255,255,0.1); border-radius:9999px; cursor:pointer; transition:all 0.3s; }
.btn-ghost:hover { color:rgba(255,255,255,0.8); border-color:rgba(255,255,255,0.22); }
.user-avatar { width:2rem; height:2rem; border-radius:50%; background:linear-gradient(135deg,#78b048,rgba(120,176,72,0.4));
    display:flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:600; color:#05050a;
    cursor:pointer; border:1px solid var(--accent-2); font-family:'DM Mono',monospace; }

/* ── MAIN ── */
.main { position:relative; z-index:10; max-width:1100px; margin:0 auto; padding:3rem 2.5rem 5rem; width:100%; }

/* ── HERO ── */
.hero { margin-bottom:4rem; animation:fadeUp 1.4s var(--ease) 0.4s both; }
.hero-eyebrow { font-family:'DM Mono',monospace; font-size:0.58rem; letter-spacing:0.25em; text-transform:uppercase;
    color:var(--accent); opacity:0.7; margin-bottom:1rem; display:flex; align-items:center; gap:0.75rem; }
.hero-eyebrow::before { content:''; width:1.5rem; height:1px; background:var(--accent); opacity:0.5; }
.hero-title { font-size:clamp(2.5rem,5vw,4.5rem); font-weight:300; font-style:italic; line-height:1.1; color:#fff; margin-bottom:0.75rem; }
.hero-sub { font-size:1rem; font-weight:300; color:rgba(255,255,255,0.4); max-width:400px; line-height:1.7; }

/* ── TABS ── */
.tabs { display:flex; border-bottom:1px solid rgba(255,255,255,0.07); margin-bottom:2.5rem; animation:fadeUp 1.4s var(--ease) 0.6s both; }
.tab { font-family:'DM Mono',monospace; font-size:0.62rem; letter-spacing:0.15em; text-transform:uppercase;
    padding:0.85rem 1.5rem; color:rgba(255,255,255,0.28); background:none; border:none; cursor:pointer; position:relative; transition:color 0.3s; }
.tab::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:1px; background:var(--accent); transform:scaleX(0); transition:transform 0.3s var(--ease); }
.tab:hover { color:rgba(255,255,255,0.55); }
.tab.active { color:var(--accent); }
.tab.active::after { transform:scaleX(1); }
.panel { display:none; }
.panel.active { display:block; animation:fadeUp 0.6s var(--ease) both; }

/* ── CARDS ── */
.collections-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:1.5rem; }
.section-title { font-family:'Cormorant Garamond',serif; font-size:1.4rem; font-weight:300; font-style:italic; color:rgba(255,255,255,0.65); }
.section-count { font-family:'DM Mono',monospace; font-size:0.6rem; letter-spacing:0.1em; color:rgba(255,255,255,0.22); text-transform:uppercase; }
.collections-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1rem; }
.col-card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); border-radius:1.25rem; padding:1.5rem; transition:border-color 0.3s,background 0.3s; }
.col-card:hover { border-color:var(--accent-2); background:rgba(120,176,72,0.04); }
.col-card-header { cursor:pointer; user-select:none; }
.col-card-element { font-family:'DM Mono',monospace; font-size:0.52rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); opacity:0.7; margin-bottom:0.6rem; display:flex; align-items:center; gap:0.4rem; }
.col-card-element-dot { width:4px; height:4px; border-radius:50%; background:var(--accent); }
.col-card-title { font-size:1.2rem; font-weight:300; color:#fff; margin-bottom:0.4rem; line-height:1.3; }
.col-card-desc { font-size:0.85rem; color:rgba(255,255,255,0.32); line-height:1.6; margin-bottom:0.75rem; }
.col-card-footer { display:flex; justify-content:space-between; align-items:center; padding-top:0.75rem; border-top:1px solid rgba(255,255,255,0.05); }
.col-card-meta { font-family:'DM Mono',monospace; font-size:0.58rem; color:rgba(255,255,255,0.22); }
.card-arrow { font-size:0.8rem; color:var(--accent); transition:transform 0.3s; display:inline-block; }
.col-card-expand { display:none; margin-top:1rem; padding-top:0.75rem; border-top:1px solid rgba(255,255,255,0.05); }
.col-card-expand.open { display:block; }
.mat-row { display:flex; gap:0.6rem; padding:0.5rem 0; border-bottom:1px solid rgba(255,255,255,0.04); align-items:flex-start; }
.mat-row:last-of-type { border-bottom:none; }
.mat-row-num { font-family:'DM Mono',monospace; font-size:0.55rem; color:rgba(255,255,255,0.18); min-width:1.2rem; padding-top:0.2rem; }
.mat-row-body { flex:1; min-width:0; }
.mat-row-title { font-size:0.88rem; color:rgba(255,255,255,0.78); line-height:1.4; }
.mat-row-title.clickable { cursor:pointer; }
.mat-row-title.clickable:hover { color:#fff; }
.mat-row-thought { font-size:0.78rem; font-style:italic; color:rgba(255,255,255,0.32); }
.mat-row-domain { font-family:'DM Mono',monospace; font-size:0.55rem; color:var(--accent); opacity:0.7; }
.mat-del-btn { background:none; border:none; color:rgba(224,90,58,0.35); cursor:pointer; font-size:0.85rem; padding:0.1rem 0.3rem; flex-shrink:0; transition:color 0.2s; }
.mat-del-btn:hover { color:rgba(224,90,58,0.9); }
.col-card-controls { display:flex; gap:0.5rem; margin-top:1rem; }
.btn-add-mat { flex:1; padding:0.6rem; background:rgba(120,176,72,0.07); border:1px solid rgba(120,176,72,0.18); border-radius:0.75rem;
    color:rgba(255,255,255,0.55); font-family:'DM Mono',monospace; font-size:0.62rem; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; transition:all 0.2s; }
.btn-add-mat:hover { background:rgba(120,176,72,0.14); color:#fff; }
.btn-del-col { padding:0.6rem 0.9rem; background:none; border:1px solid rgba(224,90,58,0.2); border-radius:0.75rem;
    color:rgba(224,90,58,0.45); font-family:'DM Mono',monospace; font-size:0.62rem; cursor:pointer; transition:all 0.2s; }
.btn-del-col:hover { border-color:rgba(224,90,58,0.6); color:rgba(224,90,58,0.9); }
.limit-banner { padding:2rem; border:1px solid var(--accent-2); border-radius:1.25rem; background:var(--accent-3); text-align:center; margin-top:1rem; }
.limit-banner-title { font-size:1.3rem; font-weight:300; font-style:italic; color:rgba(255,255,255,0.8); margin-bottom:0.5rem; }
.limit-banner-sub { font-size:0.85rem; color:rgba(255,255,255,0.32); margin-bottom:1.2rem; line-height:1.7; }
.empty-state { text-align:center; padding:5rem 2rem; border:1px dashed rgba(120,176,72,0.12); border-radius:1.5rem; }
.empty-glyph { font-size:3rem; margin-bottom:1rem; animation:emptyPulse 3.5s ease-in-out infinite; }
@keyframes emptyPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
.empty-title { font-size:1.4rem; font-weight:300; font-style:italic; margin-bottom:0.5rem; color:rgba(255,255,255,0.65); }
.empty-sub { font-size:0.85rem; color:rgba(255,255,255,0.28); margin-bottom:1.5rem; line-height:1.7; }
.friends-locked { text-align:center; padding:4rem 2rem; border:1px dashed rgba(120,176,72,0.1); border-radius:1.5rem; }
.friends-locked-glyph { font-size:2.5rem; margin-bottom:1rem; opacity:0.4; }
.friends-locked-title { font-size:1.3rem; font-weight:300; font-style:italic; color:rgba(255,255,255,0.55); margin-bottom:0.5rem; }
.friends-locked-sub { font-size:0.85rem; color:rgba(255,255,255,0.22); margin-bottom:1.5rem; line-height:1.7; }

/* ── MODAL ── */
.modal-overlay { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.82); backdrop-filter:blur(20px);
    display:flex; align-items:center; justify-content:center; padding:2rem; opacity:0; pointer-events:none; transition:opacity 0.3s; }
.modal-overlay.open { opacity:1; pointer-events:all; }
.modal { background:rgba(4,10,2,0.97); border:1px solid rgba(120,176,72,0.12); border-radius:1.75rem; padding:2.5rem;
    width:100%; max-width:540px; max-height:90vh; overflow-y:auto; animation:slideUp 0.4s var(--ease); }
.modal-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2rem; }
.modal-title { font-size:1.6rem; font-weight:300; font-style:italic; color:#fff; }
.modal-close { background:none; border:none; color:rgba(255,255,255,0.28); font-size:1.4rem; cursor:pointer; transition:color 0.2s; }
.modal-close:hover { color:#fff; }
.form-group { margin-bottom:1.25rem; }
.form-label { display:block; font-family:'DM Mono',monospace; font-size:0.6rem; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,255,255,0.28); margin-bottom:0.6rem; }
.form-label .req { color:var(--accent); margin-left:0.2rem; }
.form-input,.form-textarea,.form-select { width:100%; padding:0.8rem 1rem; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09);
    border-radius:0.75rem; color:#fff; font-family:'Cormorant Garamond',serif; font-size:1rem; outline:none; transition:border-color 0.3s; }
.form-input:focus,.form-textarea:focus,.form-select:focus { border-color:var(--accent); background:rgba(120,176,72,0.05); }
.form-input::placeholder,.form-textarea::placeholder { color:rgba(255,255,255,0.18); }
.form-textarea { resize:vertical; min-height:90px; }
.form-select option { background:#040a02; }
.element-selector { display:grid; grid-template-columns:repeat(4,1fr); gap:0.6rem; margin-top:0.5rem; }
.el-sel-btn { padding:0.6rem 0.4rem; border-radius:0.75rem; border:1px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.03);
    cursor:pointer; transition:all 0.3s; text-align:center; font-family:'DM Mono',monospace; font-size:0.55rem; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.3); }
.el-sel-btn:hover { border-color:rgba(255,255,255,0.15); color:rgba(255,255,255,0.6); }
.el-sel-btn.selected { border-color:var(--accent); color:var(--accent); background:var(--accent-3); }
.el-sel-btn .el-icon { font-size:1.2rem; display:block; margin-bottom:0.3rem; }
.mat-type-tabs { display:flex; gap:0.5rem; margin-bottom:1rem; }
.mat-type-btn { padding:0.35rem 0.85rem; border-radius:9999px; border:1px solid rgba(255,255,255,0.09); background:transparent;
    font-family:'DM Mono',monospace; font-size:0.58rem; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.3); cursor:pointer; transition:all 0.25s; }
.mat-type-btn:hover { border-color:rgba(255,255,255,0.18); color:rgba(255,255,255,0.55); }
.mat-type-btn.active { border-color:var(--accent); color:var(--accent); background:var(--accent-3); }
.toggle-row { display:flex; align-items:center; justify-content:space-between; padding:0.6rem 0; }
.toggle-label { font-size:0.88rem; color:rgba(255,255,255,0.45); }
.toggle { position:relative; width:2.4rem; height:1.3rem; }
.toggle input { opacity:0; width:0; height:0; }
.toggle-slider { position:absolute; inset:0; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); border-radius:9999px; cursor:pointer; transition:0.25s; }
.toggle-slider::before { content:''; position:absolute; width:0.85rem; height:0.85rem; left:0.2rem; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.35); border-radius:50%; transition:0.25s; }
.toggle input:checked + .toggle-slider { background:var(--accent-2); border-color:var(--accent); }
.toggle input:checked + .toggle-slider::before { transform:translateX(1.1rem) translateY(-50%); background:var(--accent); }
.modal-actions { display:flex; gap:0.75rem; margin-top:1.5rem; }
.modal-actions .btn-ghost { flex:1; text-align:center; }
.modal-actions .btn-primary { flex:2; text-align:center; }
.thought-box { background:var(--accent-3); border:1px solid var(--accent-2); border-radius:0.75rem; padding:1rem; margin-bottom:1.25rem; }
.thought-box .form-label { color:var(--accent); }
.loading { display:flex; align-items:center; gap:0.5rem; padding:3rem 0; justify-content:center;
    font-family:'DM Mono',monospace; font-size:0.7rem; color:rgba(255,255,255,0.2); }
.loading-dot { width:5px; height:5px; border-radius:50%; background:var(--accent); animation:ldot 1.2s ease-in-out infinite; }
.loading-dot:nth-child(2){animation-delay:0.2s} .loading-dot:nth-child(3){animation-delay:0.4s}
@keyframes ldot { 0%,100%{opacity:0.2;transform:scale(1)} 50%{opacity:1;transform:scale(1.3)} }
.toast-area { position:fixed; bottom:2rem; right:2rem; z-index:999; display:flex; flex-direction:column; gap:0.5rem; }
.toast { padding:0.75rem 1.25rem; background:rgba(4,10,2,0.96); border:1px solid rgba(255,255,255,0.1); border-radius:0.75rem;
    font-size:0.82rem; color:#fff; animation:toastIn 0.3s var(--ease); max-width:280px; }
.toast.success { border-color:var(--accent); color:var(--accent); }
.toast.error { border-color:#e05a3a; color:#e05a3a; }
@keyframes toastIn { from{opacity:0;transform:translateX(1rem)} to{opacity:1;transform:translateX(0)} }


/* ── ЛЕНТА ДРУЗЕЙ ── */
.feed-section-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:1.25rem; }
.feed-item { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:1.25rem;
    padding:1.25rem 1.5rem; margin-bottom:0.75rem; transition:border-color 0.3s; }
.feed-item:hover { border-color:rgba(255,255,255,0.14); }
.feed-item-header { display:flex; align-items:center; gap:0.75rem; margin-bottom:0.85rem; }
.feed-avatar { width:1.8rem; height:1.8rem; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'DM Mono',monospace; font-size:0.65rem; font-weight:600; color:#05050a; flex-shrink:0; }
.feed-author { flex:1; }
.feed-author-name { font-family:'DM Mono',monospace; font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.6); }
.feed-author-time { font-family:'DM Mono',monospace; font-size:0.52rem; color:rgba(255,255,255,0.2); margin-top:0.15rem; }
.feed-col-title { font-size:1.1rem; font-weight:300; color:#fff; margin-bottom:0.3rem; line-height:1.3; }
.feed-col-desc { font-size:0.85rem; color:rgba(255,255,255,0.3); line-height:1.6; margin-bottom:0.6rem; }
.feed-col-element { font-family:'DM Mono',monospace; font-size:0.52rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--accent); opacity:0.6; display:flex; align-items:center; gap:0.35rem; margin-bottom:0.6rem; }
.feed-col-dot { width:4px; height:4px; border-radius:50%; background:var(--accent); }
.feed-mats-preview { display:flex; flex-direction:column; gap:0.3rem; }
.feed-mat { font-size:0.82rem; color:rgba(255,255,255,0.38); padding:0.25rem 0;
    border-bottom:1px solid rgba(255,255,255,0.04); display:flex; align-items:baseline; gap:0.5rem; }
.feed-mat:last-child { border-bottom:none; }
.feed-mat-num { font-family:'DM Mono',monospace; font-size:0.5rem; color:rgba(255,255,255,0.18); flex-shrink:0; }
.feed-mat-title { cursor:pointer; transition:color 0.2s; flex:1; }
.feed-mat-title:hover { color:#fff; }
.feed-mat-domain { font-family:'DM Mono',monospace; font-size:0.5rem; color:var(--accent); opacity:0.5; flex-shrink:0; }
.feed-more { font-family:'DM Mono',monospace; font-size:0.52rem; letter-spacing:0.1em; text-transform:uppercase;
    color:rgba(255,255,255,0.2); margin-top:0.6rem; display:block; }
.feed-invite-row { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;
    margin-top:1.5rem; padding:1.25rem 1.5rem; background:rgba(255,255,255,0.02);
    border:1px dashed rgba(255,255,255,0.07); border-radius:1.25rem; }
.feed-invite-text { font-size:0.88rem; color:rgba(255,255,255,0.28); line-height:1.6; }
.feed-invite-text strong { color:rgba(255,255,255,0.55); font-weight:400; }

/* ── ЗАМОРОЗКА ── */
.col-card-frozen { position:relative; pointer-events:none; }
.col-card-frozen::after {
    content:''; position:absolute; inset:0; border-radius:1.25rem; z-index:10;
    background:linear-gradient(145deg, rgba(140,210,255,0.18) 0%, rgba(180,230,255,0.08) 50%, rgba(120,190,255,0.14) 100%);
    border:1px solid rgba(160,220,255,0.25); backdrop-filter:blur(3px);
}
.col-card-frozen .col-card-title,
.col-card-frozen .col-card-desc { filter:blur(3px); user-select:none; }
.freeze-banner {
    margin-top:1.5rem; padding:2rem 2.5rem;
    background:linear-gradient(145deg, rgba(140,210,255,0.06) 0%, rgba(180,230,255,0.03) 100%);
    border:1px solid rgba(160,220,255,0.15); border-radius:1.25rem; position:relative; overflow:hidden;
}
.freeze-banner::before {
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(160,220,255,0.08) 0%, transparent 60%);
    pointer-events:none;
}
.freeze-banner-title { font-size:1.1rem; font-weight:300; color:rgba(180,230,255,0.8); margin-bottom:0.75rem; position:relative; }
.freeze-banner-text { font-size:0.88rem; color:rgba(255,255,255,0.3); line-height:1.85; position:relative; }
.freeze-banner-text strong { color:rgba(255,255,255,0.6); font-weight:400; }
@keyframes fadeUp   { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideUp  { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
@media (max-width:768px) { .header{padding:1rem 1.25rem} .main{padding:2rem 1.25rem 4rem} .collections-grid{grid-template-columns:1fr} .element-selector{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>

<div class="bg-layer">
    <div class="earth-deep"></div>
    <div class="earth-glow-1"></div>
    <div class="earth-glow-2"></div>
    <div class="earth-glow-3"></div>
    <div class="earth-particles" id="earth-pts"></div>
</div>
<div class="grain"></div>
<div class="toast-area" id="toast-area"></div>

<header class="header">
    <div class="header-left">
        <a href="stihii.html" class="logo-btn">БУДУМ</a>
        <div class="element-pill" onclick="window.location.href='stihii.html'">
            <div class="element-pill-dot"></div>
            <span class="element-pill-name">Земля</span>
        </div>
    </div>
    <div class="header-right">
        <button class="btn-primary" onclick="openCreateModal()">+ Коллекция</button>
        <div class="user-avatar" id="user-avatar" onclick="window.location.href='profile.html'">?</div>
    </div>
</header>

<main class="main">
    <div class="hero">
        <div class="hero-eyebrow">Твоя стихия сейчас</div>
        <h1 class="hero-title">Земля</h1>
        <p class="hero-sub">Здесь всё, что даёт опору, корни и ощущение дома.</p>
    </div>
    <div class="tabs">
        <button class="tab active" onclick="switchTab('mine',this)">Мои коллекции</button>
        <button class="tab" onclick="switchTab('friends',this)">Лента друзей</button>
    </div>
    <div class="panel active" id="panel-mine">
        <div class="collections-header">
            <div class="section-title">Коллекции</div>
            <div class="section-count" id="mine-count"></div>
        </div>
        <div id="mine-grid"><div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div><span>загружаем</span></div></div>
    </div>
    <div class="panel" id="panel-friends"><div id="friends-content"></div></div>
</main>

<!-- MODAL: CREATE -->
<div class="modal-overlay" id="create-modal" onclick="if(event.target===this)closeCreateModal()">
    <div class="modal">
        <div class="modal-head"><div class="modal-title">Новая коллекция</div><button class="modal-close" onclick="closeCreateModal()">×</button></div>
        <div class="form-group"><label class="form-label">Название <span class="req">*</span></label><input class="form-input" id="col-title" placeholder="Места где хорошо..."></div>
        <div class="form-group"><label class="form-label">Описание</label><textarea class="form-textarea" id="col-desc" placeholder="О чём эта коллекция..."></textarea></div>
        <div class="form-group">
            <label class="form-label">Стихия</label>
            <div class="element-selector">
                <button class="el-sel-btn" data-el="water" onclick="selectElement('water',this)"><span class="el-icon">◎</span>Вода</button>
                <button class="el-sel-btn" data-el="air" onclick="selectElement('air',this)"><span class="el-icon">◇</span>Воздух</button>
                <button class="el-sel-btn" data-el="fire" onclick="selectElement('fire',this)"><span class="el-icon">◈</span>Огонь</button>
                <button class="el-sel-btn selected" data-el="earth" onclick="selectElement('earth',this)"><span class="el-icon">◉</span>Земля</button>
            </div>
        </div>
        <div class="toggle-row"><span class="toggle-label">Публичная</span><label class="toggle"><input type="checkbox" id="col-public" checked><span class="toggle-slider"></span></label></div>
        <div class="modal-actions"><button class="btn-ghost" onclick="closeCreateModal()">Отмена</button><button class="btn-primary" onclick="saveCollection()">Создать →</button></div>
    </div>
</div>

<!-- MODAL: MATERIAL -->
<div class="modal-overlay" id="material-modal" onclick="if(event.target===this)closeMaterialModal()">
    <div class="modal">
        <div class="modal-head"><div class="modal-title">Добавить материал</div><button class="modal-close" onclick="closeMaterialModal()">×</button></div>
        <div class="mat-type-tabs">
            <button class="mat-type-btn active" data-type="link" onclick="setMatType('link',this)">↗ Ссылка</button>
            <button class="mat-type-btn" data-type="note" onclick="setMatType('note',this)">✎ Заметка</button>
            <button class="mat-type-btn" data-type="image" onclick="setMatType('image',this)">◻ Образ</button>
        </div>
        <div id="mat-link-fields">
            <div class="form-group"><label class="form-label">URL <span class="req">*</span></label><input class="form-input" id="mat-url" type="url" placeholder="https://..."></div>
            <div class="form-group"><label class="form-label">Заголовок <span class="req">*</span></label><input class="form-input" id="mat-title" placeholder="Название"></div>
            <div class="form-group"><label class="form-label">Источник</label><input class="form-input" id="mat-source" placeholder="Книга, фильм..."></div>
        </div>
        <div id="mat-note-fields" style="display:none"><div class="form-group"><label class="form-label">Заголовок</label><input class="form-input" id="mat-note-title" placeholder="Название заметки"></div></div>
        <div id="mat-image-fields" style="display:none">
            <div class="form-group"><label class="form-label">URL изображения <span class="req">*</span></label><input class="form-input" id="mat-image-url" type="url" placeholder="https://..."></div>
            <div class="form-group"><label class="form-label">Подпись</label><input class="form-input" id="mat-image-caption" placeholder="Что это для тебя..."></div>
        </div>
        <div class="thought-box"><label class="form-label">Твоя мысль <span class="req">*</span></label><textarea class="form-textarea" id="mat-thought" style="background:transparent;border:none;padding:0.4rem 0" placeholder="Почему это важно?"></textarea></div>
        <div class="form-group"><label class="form-label">Коллекция <span class="req">*</span></label><select class="form-select" id="mat-collection"></select></div>
        <div class="modal-actions"><button class="btn-ghost" onclick="closeMaterialModal()">Отмена</button><button class="btn-primary" onclick="saveMaterial()">Сохранить →</button></div>
    </div>
</div>

<script type="module">
import { supabase, LIMITS, getCurrentUser, checkCollectionLimit, checkMaterialLimit } from './js/supabase-client.js'

const ELEMENT = 'earth'
const ELEMENT_NAMES = { water:'Вода', air:'Воздух', fire:'Огонь', earth:'Земля' }
let currentUser = null, userTier = 'seeker', selectedElement = 'earth', currentMatType = 'link'

// ── СПОРЫ ──
function spawnSpores() {
    const c = document.getElementById('earth-pts')
    if (!c) return
    const styleEl = document.createElement('style')
    let css = ''
    for (let i = 0; i < 30; i++) {
        const sz = 2 + Math.random() * 6
        const left = 5 + Math.random() * 90
        const bottom = 5 + Math.random() * 50
        const tx = (Math.random() - 0.5) * 60
        const ty = -(60 + Math.random() * 140)
        const dur = 6 + Math.random() * 10
        const delay = -(Math.random() * 14)
        const name = `spore${i}`
        const g = Math.floor(140 + Math.random() * 80)
        css += `@keyframes ${name}{0%{transform:translateY(0) translateX(0) scale(0.4);opacity:0}8%{opacity:0.85}85%{opacity:0.25}100%{transform:translateY(${ty}px) translateX(${tx}px) scale(1);opacity:0}}`
        const p = document.createElement('div')
        p.style.cssText = `position:absolute;width:${sz}px;height:${sz}px;left:${left}%;bottom:${bottom}%;border-radius:50%;background:radial-gradient(circle,rgba(60,${g},30,0.9),transparent 70%);animation:${name} ${dur}s linear ${delay}s infinite;`
        c.appendChild(p)
    }
    styleEl.textContent = css
    document.head.appendChild(styleEl)
}

spawnSpores()
;(async () => {
    const user = await getCurrentUser()
    if (!user) { window.location.href = 'login.html'; return }
    currentUser = user; userTier = user.profile?.tier || 'seeker'
    const av = document.getElementById('user-avatar')
    if (av) av.textContent = (user.profile?.nickname || '?').charAt(0).toUpperCase()
    await loadMyCollections()
})()

window.switchTab = (tab, btn) => { document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active')); btn.classList.add('active'); document.getElementById('panel-'+tab).classList.add('active'); if(tab==='friends') loadFriends() }
function toast(msg, type='') { const a=document.getElementById('toast-area'); const d=document.createElement('div'); d.className='toast '+type; d.textContent=msg; a.appendChild(d); setTimeout(()=>d.remove(),3500) }
function getDomain(url) { try{return new URL(url).hostname.replace(/^www./,'')}catch{return ''} }
function formatDate(iso) { try{return new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}catch{return ''} }

async function loadMyCollections() {
    const grid = document.getElementById('mine-grid')
    const { data: cols, error } = await supabase.from('collections').select('*, materials(count)').eq('user_id',currentUser.id).order('created_at',{ascending:false})
    if (error) { grid.innerHTML='<div class="empty-state"><div class="empty-title">Ошибка загрузки</div></div>'; return }
    const elCols = cols.filter(c=>c.element===ELEMENT)
    const limit = LIMITS[userTier].collections_per_element
    document.getElementById('mine-count').textContent = `${elCols.length} коллекций`
    if (!elCols.length) { grid.innerHTML=`<div class="empty-state"><div class="empty-glyph">◉</div><div class="empty-title">Пока пусто</div><div class="empty-sub">Создай первую коллекцию земли — всё, что даёт опору.</div></div>`; return }
    grid.innerHTML=''; const gd=document.createElement('div'); gd.className='collections-grid'
    const frozenCols = userTier==='seeker' ? elCols.slice(limit) : []
    const visibleCols = userTier==='seeker' ? elCols.slice(0, limit) : elCols
    for (const col of visibleCols) gd.appendChild(renderCard(col))
    for (const col of frozenCols) { const card=renderCard(col); card.classList.add('col-card-frozen'); gd.appendChild(card) }
    grid.appendChild(gd)
    if (frozenCols.length > 0) {
        const b=document.createElement('div'); b.className='freeze-banner'
        b.innerHTML=`<div class="freeze-banner-title">❄ Вы отключили подписку</div><div class="freeze-banner-text">Ваши <strong>${elCols.length} коллекций</strong> заморожены в вечном льду. Вы видите только первые <strong>${limit} коллекции</strong> и все материалы внутри них. Остальные <strong>${frozenCols.length} коллекции</strong> не удалены — они ждут вашего возвращения.<br><br>Как только вы снова станете Хранителем — они разморозятся в том же виде, в котором вы их оставили.</div><button class="btn-primary" style="margin-top:1.25rem" onclick="window.location.href='subscribe.html'">Стать Хранителем →</button>`
        grid.appendChild(b)
    } else if (elCols.length>=limit && userTier==='seeker') { const b=document.createElement('div'); b.className='limit-banner'; b.innerHTML=`<div class="limit-banner-title">◉ Коллекций земли: ${elCols.length} из ${limit}</div><div class="limit-banner-sub">У Искателя — 3 коллекции в каждой стихии.<br>Стань Хранителем — открой до 20.</div><button class="btn-primary" onclick="window.location.href='subscribe.html'">Стать Хранителем →</button>`; grid.appendChild(b) }
}

function renderCard(col) {
    const matCount=col.materials?.[0]?.count||0; const elName=ELEMENT_NAMES[col.element]||col.element
    const card=document.createElement('div'); card.className='col-card'
    card.innerHTML=`<div class="col-card-header" data-col-id="${col.id}"><div class="col-card-element"><div class="col-card-element-dot"></div>${elName}</div><div class="col-card-title">${col.title}</div>${col.description?`<div class="col-card-desc">${col.description}</div>`:''}<div class="col-card-footer"><div class="col-card-meta">${matCount} материалов · ${formatDate(col.created_at)}</div><span class="card-arrow">↓</span></div></div><div class="col-card-expand" id="exp-${col.id}"><div id="mats-${col.id}"><div class="loading"><div class="loading-dot"></div><span>загружаем</span></div></div><div class="col-card-controls"><button class="btn-add-mat" data-col-id="${col.id}">+ Материал</button><button class="btn-del-col" data-col-id="${col.id}">Удалить</button></div></div>`
    return card
}

document.addEventListener('click', async e => {
    const h=e.target.closest('.col-card-header'); if(h){const id=h.dataset.colId;const exp=document.getElementById('exp-'+id);const arrow=h.querySelector('.card-arrow');if(!exp)return;const open=exp.classList.toggle('open');if(arrow)arrow.style.transform=open?'rotate(180deg)':'';if(open)await loadMaterials(id);return}
    const add=e.target.closest('.btn-add-mat');if(add){e.stopPropagation();openAddMaterial(add.dataset.colId);return}
    const del=e.target.closest('.btn-del-col');if(del){e.stopPropagation();if(confirm('Удалить коллекцию?'))deleteCollection(del.dataset.colId);return}
    const dm=e.target.closest('.mat-del-btn');if(dm){e.stopPropagation();if(confirm('Удалить материал?'))deleteMaterial(dm.dataset.matId,dm.dataset.colId);return}
})

async function loadMaterials(colId) {
    const c=document.getElementById('mats-'+colId);if(!c)return
    const{data:mats}=await supabase.from('materials').select('*').eq('collection_id',colId).order('created_at')
    if(!mats?.length){c.innerHTML='<div style="font-size:0.85rem;color:rgba(255,255,255,0.18);padding:0.5rem 0">Пока нет материалов</div>';return}
    c.innerHTML=mats.map((m,i)=>`<div class="mat-row"><div class="mat-row-num">${i+1}</div><div class="mat-row-body"><div class="mat-row-title ${m.url?'clickable':''}" ${m.url?`onclick="window.open('${m.url}','_blank')"`:''} >${m.title}</div>${m.comment?`<div class="mat-row-thought">${m.comment}</div>`:''} ${m.url?`<div class="mat-row-domain">${getDomain(m.url)}</div>`:''}</div><button class="mat-del-btn" data-mat-id="${m.id}" data-col-id="${colId}">×</button></div>`).join('')
}

async function loadFriends() {
    const c = document.getElementById('friends-content')
    if (userTier === 'seeker') {
        c.innerHTML = `<div class="friends-locked"><div class="friends-locked-glyph">◉</div><div class="friends-locked-title">Лента друзей — для Хранителей</div><div class="friends-locked-sub">Подпишись чтобы видеть коллекции друзей.</div><button class="btn-primary" onclick="window.location.href='subscribe.html'">Стать Хранителем →</button></div>`
        return
    }
    c.innerHTML = '<div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div><span>загружаем ленту</span></div>'
    const { data: friendships } = await supabase.from('friendships').select('user_from, user_to').eq('status','accepted').or(`user_from.eq.${currentUser.id},user_to.eq.${currentUser.id}`)
    if (!friendships?.length) { c.innerHTML = `<div class="empty-state"><div class="empty-glyph">◉</div><div class="empty-title">Пока тихо</div><div class="empty-sub">Пригласи друзей — их коллекции появятся здесь.</div><button class="btn-ghost" style="margin-top:1rem" onclick="window.location.href='profile.html'">Пригласить друга →</button></div>`; return }
    const friendIds = [...new Set(friendships.map(f => f.user_from === currentUser.id ? f.user_to : f.user_from).filter(Boolean))]
    const { data: profiles } = await supabase.from('profiles').select('id, nickname, element').in('id', friendIds)
    const { data: cols } = await supabase.from('collections').select('*, materials(count)').in('user_id', friendIds).eq('element', ELEMENT).eq('is_public', true).order('created_at', { ascending: false }).limit(30)
    if (!cols?.length) { c.innerHTML = `<div class="empty-state"><div class="empty-glyph">◉</div><div class="empty-title">Пока тихо</div><div class="empty-sub">У твоих друзей пока нет коллекций этой стихии.</div><button class="btn-ghost" style="margin-top:1rem" onclick="window.location.href='profile.html'">Пригласить друга →</button></div>`; return }
    const profileMap = Object.fromEntries((profiles || []).map(p => [p.id, p]))
    const AVATAR_COLORS = { water:'linear-gradient(135deg,#0b2448,#1a6090)', air:'linear-gradient(135deg,#06040e,#c8a860)', fire:'linear-gradient(135deg,#3a0a02,#c04020)', earth:'linear-gradient(135deg,#0a1804,#3a7820)' }
    c.innerHTML = ''
    const header = document.createElement('div'); header.className = 'feed-section-header'
    header.innerHTML = `<div class="section-title">Коллекции друзей</div><div class="section-count">${cols.length} коллекций</div>`
    c.appendChild(header)
    for (const col of cols) {
        const profile = profileMap[col.user_id] || {}
        const nick = profile.nickname || '?'
        const el = profile.element || 'water'
        const matCount = col.materials?.[0]?.count || 0
        const item = document.createElement('div'); item.className = 'feed-item'
        item.innerHTML = `<div class="feed-item-header"><div class="feed-avatar" style="background:${AVATAR_COLORS[el] || AVATAR_COLORS.water}">${nick.charAt(0).toUpperCase()}</div><div class="feed-author"><div class="feed-author-name">${nick}</div><div class="feed-author-time">${formatDate(col.created_at)}</div></div></div><div class="feed-col-element"><div class="feed-col-dot"></div>${ELEMENT_NAMES[col.element] || col.element}</div><div class="feed-col-title">${col.title}</div>${col.description ? `<div class="feed-col-desc">${col.description}</div>` : ''}<div id="feed-mats-${col.id}" class="feed-mats-preview">${matCount > 0 ? `<div class="feed-more" style="cursor:pointer" onclick="loadFeedMaterials(${col.id})">↓ Показать ${matCount} материалов</div>` : '<div class="feed-more">Материалов пока нет</div>'}</div>`
        c.appendChild(item)
    }
    const inviteRow = document.createElement('div'); inviteRow.className = 'feed-invite-row'
    inviteRow.innerHTML = `<div class="feed-invite-text">Хочешь видеть больше? <strong>Пригласи ещё друзей</strong></div><button class="btn-ghost" onclick="window.location.href='profile.html'">Пригласить →</button>`
    c.appendChild(inviteRow)
}

window.loadFeedMaterials = async function(colId) {
    const container = document.getElementById(`feed-mats-${colId}`); if (!container) return
    container.innerHTML = '<div class="loading"><div class="loading-dot"></div><span>загружаем</span></div>'
    const { data: mats } = await supabase.from('materials').select('*').eq('collection_id', colId).order('created_at').limit(10)
    if (!mats?.length) { container.innerHTML = '<div class="feed-more">Нет материалов</div>'; return }
    container.innerHTML = mats.map((m,i) => `<div class="feed-mat"><span class="feed-mat-num">${i+1}</span><span class="feed-mat-title" ${m.url ? `onclick="window.open('${m.url}','_blank')"` : ''}>${m.title}</span>${m.url ? `<span class="feed-mat-domain">${getDomain(m.url)}</span>` : ''}</div>`).join('')
}
    c.innerHTML='<div class="empty-state"><div class="empty-glyph">◉</div><div class="empty-title">Пока тихо</div><div class="empty-sub">Пригласи друзей.</div></div>'
}

// ── FRIENDS TAB ──
async function loadFriends() {
    const container = document.getElementById('friends-content')
    if (userTier === 'seeker') {
        container.innerHTML = `
            <div class="friends-locked">
                <div class="friends-locked-glyph">◉</div>
                <div class="friends-locked-title">Лента друзей — для Хранителей</div>
                <div class="friends-locked-sub">Подпишись чтобы видеть коллекции друзей,<br>приглашать их и делать репосты.</div>
                <button class="btn-primary" onclick="window.location.href='subscribe.html'">Стать Хранителем →</button>
            </div>`
        return
    }

    container.innerHTML = '<div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div><span>загружаем ленту</span></div>'

    // Получаем список друзей (accepted)
    const { data: friendships } = await supabase
        .from('friendships')
        .select('user_from, user_to')
        .eq('status', 'accepted')
        .or(`user_from.eq.${currentUser.id},user_to.eq.${currentUser.id}`)

    if (!friendships?.length) {
        container.innerHTML = renderEmptyFeed()
        return
    }

    // ID друзей
    const friendIds = [...new Set(friendships.map(f =>
        f.user_from === currentUser.id ? f.user_to : f.user_from
    ).filter(Boolean))]

    // Загружаем профили друзей
    const { data: profiles } = await supabase
        .from('profiles')
        .select('id, nickname, element')
        .in('id', friendIds)

    // Загружаем их публичные коллекции (стихия текущей страницы)
    const { data: cols } = await supabase
        .from('collections')
        .select('*, materials(count)')
        .in('user_id', friendIds)
        .eq('element', ELEMENT)
        .eq('is_public', true)
        .order('created_at', { ascending: false })
        .limit(30)

    if (!cols?.length) {
        container.innerHTML = renderEmptyFeed()
        return
    }

    // Группируем по автору
    const profileMap = Object.fromEntries((profiles || []).map(p => [p.id, p]))
    const AVATAR_COLORS = {
        water:'linear-gradient(135deg,#0b2448,#1a6090)',
        air:  'linear-gradient(135deg,#06040e,#c8a860)',
        fire: 'linear-gradient(135deg,#3a0a02,#c04020)',
        earth:'linear-gradient(135deg,#0a1804,#3a7820)',
    }

    container.innerHTML = ''

    // Заголовок
    const header = document.createElement('div')
    header.className = 'feed-section-header'
    header.innerHTML = `<div class="section-title">Коллекции друзей</div><div class="section-count">${cols.length} коллекций</div>`
    container.appendChild(header)

    for (const col of cols) {
        const profile = profileMap[col.user_id] || {}
        const nick = profile.nickname || '?'
        const el = profile.element || 'water'
        const matCount = col.materials?.[0]?.count || 0
        const avatarBg = AVATAR_COLORS[el] || AVATAR_COLORS.water

        const item = document.createElement('div')
        item.className = 'feed-item'
        item.innerHTML = `
            <div class="feed-item-header">
                <div class="feed-avatar" style="background:${avatarBg}">${nick.charAt(0).toUpperCase()}</div>
                <div class="feed-author">
                    <div class="feed-author-name">${nick}</div>
                    <div class="feed-author-time">${formatDate(col.created_at)}</div>
                </div>
            </div>
            <div class="feed-col-element"><div class="feed-col-dot"></div>${ELEMENT_NAMES[col.element] || col.element}</div>
            <div class="feed-col-title">${col.title}</div>
            ${col.description ? `<div class="feed-col-desc">${col.description}</div>` : ''}
            <div id="feed-mats-${col.id}" class="feed-mats-preview">
                ${matCount > 0 ? `<div class="feed-more" style="cursor:pointer" onclick="loadFeedMaterials(${col.id})">↓ Показать ${matCount} материалов</div>` : '<div class="feed-more">Материалов пока нет</div>'}
            </div>
        `
        container.appendChild(item)
    }

    // Кнопка пригласить ещё
    const inviteRow = document.createElement('div')
    inviteRow.className = 'feed-invite-row'
    inviteRow.innerHTML = `
        <div class="feed-invite-text">Хочешь видеть больше? <strong>Пригласи ещё друзей</strong> — их коллекции появятся здесь.</div>
        <button class="btn-ghost" onclick="window.location.href='profile.html'">Пригласить →</button>
    `
    container.appendChild(inviteRow)
}

function renderEmptyFeed() {
    return `<div class="empty-state"><div class="empty-glyph">◉</div><div class="empty-title">Пока тихо</div><div class="empty-sub">Пригласи друзей — их коллекции появятся здесь.</div><button class="btn-ghost" style="margin-top:1rem" onclick="window.location.href='profile.html'">Пригласить друга →</button></div>`
}

window.loadFeedMaterials = async function(colId) {
    const container = document.getElementById(`feed-mats-${colId}`)
    if (!container) return
    container.innerHTML = '<div class="loading"><div class="loading-dot"></div><span>загружаем</span></div>'
    const { data: mats } = await supabase.from('materials').select('*').eq('collection_id', colId).order('created_at').limit(10)
    if (!mats?.length) { container.innerHTML = '<div class="feed-more">Нет материалов</div>'; return }
    container.innerHTML = mats.map((m, i) => `
        <div class="feed-mat">
            <span class="feed-mat-num">${i+1}</span>
            <span class="feed-mat-title" ${m.url ? `onclick="window.open('${m.url}','_blank')"` : ''}>${m.title}</span>
            ${m.url ? `<span class="feed-mat-domain">${getDomain(m.url)}</span>` : ''}
        </div>
    `).join('')
}

window.openCreateModal=async()=>{const can=await checkCollectionLimit(currentUser.id,ELEMENT,userTier);if(!can){toast(userTier==='seeker'?'Лимит 3 коллекции. Стань Хранителем!':'Лимит 20 коллекций','error');return};document.getElementById('col-title').value='';document.getElementById('col-desc').value='';selectElement(ELEMENT,document.querySelector(`.el-sel-btn[data-el="${ELEMENT}"]`));document.getElementById('create-modal').classList.add('open')}
window.closeCreateModal=()=>document.getElementById('create-modal').classList.remove('open')
window.selectElement=(el,btn)=>{selectedElement=el;document.querySelectorAll('.el-sel-btn').forEach(b=>b.classList.remove('selected'));if(btn)btn.classList.add('selected')}
window.saveCollection=async()=>{const title=document.getElementById('col-title').value.trim();if(!title){toast('Введи название','error');return};const btn=document.querySelector('#create-modal .btn-primary');btn.textContent='Создаём...';btn.disabled=true;const can=await checkCollectionLimit(currentUser.id,selectedElement,userTier);if(!can){toast('Лимит достигнут','error');btn.textContent='Создать →';btn.disabled=false;return};const{error}=await supabase.from('collections').insert({user_id:currentUser.id,title,description:document.getElementById('col-desc').value.trim(),element:selectedElement,is_public:document.getElementById('col-public').checked});btn.textContent='Создать →';btn.disabled=false;if(error){toast('Ошибка: '+error.message,'error');return};toast('Коллекция создана!','success');closeCreateModal();await loadMyCollections()}
window.openAddMaterial=async colId=>{const can=await checkMaterialLimit(colId,userTier);if(!can){toast(userTier==='seeker'?'Лимит 5 материалов. Стань Хранителем!':'Лимит 50','error');return};['mat-url','mat-title','mat-source','mat-thought','mat-note-title','mat-image-url','mat-image-caption'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});await loadCollectionsForSelect(colId);setMatType('link',document.querySelector('.mat-type-btn[data-type="link"]'));document.getElementById('material-modal').classList.add('open')}
window.closeMaterialModal=()=>document.getElementById('material-modal').classList.remove('open')
window.setMatType=(type,btn)=>{currentMatType=type;document.querySelectorAll('.mat-type-btn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');document.getElementById('mat-link-fields').style.display=type==='link'?'':'none';document.getElementById('mat-note-fields').style.display=type==='note'?'':'none';document.getElementById('mat-image-fields').style.display=type==='image'?'':'none'}
async function loadCollectionsForSelect(selectedId){const sel=document.getElementById('mat-collection');sel.innerHTML='<option>Загружаем...</option>';const{data:cols}=await supabase.from('collections').select('id,title').eq('user_id',currentUser.id).order('created_at');sel.innerHTML=cols?.length?cols.map(c=>`<option value="${c.id}"${c.id==selectedId?' selected':''}>${c.title}</option>`).join(''):'<option value="">Сначала создай коллекцию</option>'}
window.saveMaterial=async()=>{const thought=document.getElementById('mat-thought').value.trim();const colId=document.getElementById('mat-collection').value;if(!thought){toast('Добавь мысль','error');return};if(!colId){toast('Выбери коллекцию','error');return};let title='',url='',source='';if(currentMatType==='link'){url=document.getElementById('mat-url').value.trim();title=document.getElementById('mat-title').value.trim();source=document.getElementById('mat-source').value.trim();if(!url){toast('Введи ссылку','error');return};if(!title){toast('Введи заголовок','error');return}}else if(currentMatType==='note'){title=document.getElementById('mat-note-title').value.trim()||'Заметка'}else{url=document.getElementById('mat-image-url').value.trim();title=document.getElementById('mat-image-caption').value.trim()||'Образ';if(!url){toast('Введи URL','error');return}};const can=await checkMaterialLimit(colId,userTier);if(!can){toast('Лимит материалов','error');return};const btn=document.querySelector('#material-modal .btn-primary');btn.textContent='Сохраняем...';btn.disabled=true;const{error}=await supabase.from('materials').insert({collection_id:parseInt(colId),user_id:currentUser.id,title,url,source,comment:thought});btn.textContent='Сохранить →';btn.disabled=false;if(error){toast('Ошибка: '+error.message,'error');return};toast('Материал добавлен!','success');closeMaterialModal();await loadMaterials(colId)}
async function deleteCollection(id){const{error}=await supabase.from('collections').delete().eq('id',id).eq('user_id',currentUser.id);if(error){toast('Ошибка','error');return};toast('Коллекция удалена','success');await loadMyCollections()}
async function deleteMaterial(matId,colId){const{error}=await supabase.from('materials').delete().eq('id',matId).eq('user_id',currentUser.id);if(error){toast('Ошибка','error');return};toast('Материал удалён','success');await loadMaterials(colId)}
</script>
</body>
</html>
