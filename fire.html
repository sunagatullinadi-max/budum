<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БУДУМ — Огонь</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Unbounded:wght@200;300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
    --ease: cubic-bezier(0.16,1,0.3,1);
    --el-bg-1: #100402; --el-bg-2: #180605; --el-bg-3: #200808;
    --el-accent: #e87840; --el-accent-2: rgba(232,120,64,0.15); --el-accent-3: rgba(232,120,64,0.06);
    --el-glow: rgba(220,80,20,0.2); --el-particle: rgba(255,160,60,0.55);
    --text-on-element: #f0ece4;
    --text-2-on-element: rgba(240,236,228,0.6);
    --text-3-on-element: rgba(240,236,228,0.35);
}

html, body { width:100%; min-height:100%; background:var(--el-bg-1); font-family:'Cormorant Garamond',serif; color:var(--text-on-element); overflow-x:hidden; margin:0; padding:0; }

/* ── BG ── */
.bg-layer { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.bg-water,.bg-air,.bg-earth { position:absolute; inset:0; display:none; }
.bg-fire { position:absolute; inset:0; display:block; }

.fire-dark { position:absolute; inset:0; background:linear-gradient(180deg,#060200 0%,#0e0403 20%,#160605 45%,#1e0806 70%,#260a07 100%); }
.fire-core { position:absolute; bottom:-10%; left:50%; transform:translateX(-50%); width:120%; height:85%; background:radial-gradient(ellipse at 50% 100%,rgba(255,80,10,0.3) 0%,rgba(200,40,5,0.15) 40%,transparent 70%),radial-gradient(ellipse at 30% 90%,rgba(255,120,20,0.2) 0%,transparent 50%),radial-gradient(ellipse at 70% 90%,rgba(220,60,5,0.18) 0%,transparent 50%); animation:fireCoreAnim 2s ease-in-out infinite alternate; }
@keyframes fireCoreAnim { 0%{transform:translateX(-50%) scaleX(0.97) scaleY(1);opacity:0.8} 50%{transform:translateX(-50%) scaleX(1.02) scaleY(1.06);opacity:1} 100%{transform:translateX(-50%) scaleX(1.01) scaleY(1.03);opacity:0.9} }
.fire-flames-bg { position:absolute; bottom:0; left:-5%; right:-5%; width:110%; height:65%; overflow:hidden; }
.fire-flame-bg { position:absolute; bottom:0; border-radius:50% 50% 25% 25%; mix-blend-mode:screen; transform-origin:bottom center; }
.fire-flame-bg:nth-child(1) { width:60%; height:90%; left:20%; background:radial-gradient(ellipse at 50% 85%,rgba(255,150,20,0.4),rgba(220,60,5,0.2) 50%,transparent 75%); animation:flameBg1 2.2s ease-in-out infinite alternate; }
.fire-flame-bg:nth-child(2) { width:40%; height:75%; left:-5%; background:radial-gradient(ellipse at 50% 85%,rgba(255,100,10,0.3),rgba(180,30,5,0.15) 50%,transparent 75%); animation:flameBg2 1.8s ease-in-out infinite alternate; animation-delay:-0.5s; }
.fire-flame-bg:nth-child(3) { width:40%; height:70%; right:-5%; background:radial-gradient(ellipse at 50% 85%,rgba(255,110,15,0.28),rgba(200,40,5,0.14) 50%,transparent 75%); animation:flameBg1 2.5s ease-in-out infinite alternate; animation-delay:-1s; }
.fire-flame-bg:nth-child(4) { width:30%; height:55%; left:-2%; background:radial-gradient(ellipse at 50% 85%,rgba(255,80,5,0.22),transparent 70%); animation:flameBg2 1.6s ease-in-out infinite alternate; animation-delay:-0.3s; }
.fire-flame-bg:nth-child(5) { width:30%; height:50%; right:-2%; background:radial-gradient(ellipse at 50% 85%,rgba(255,70,5,0.2),transparent 70%); animation:flameBg1 2s ease-in-out infinite alternate; animation-delay:-1.2s; }
@keyframes flameBg1 { 0%{transform:scaleX(1) scaleY(1) translateY(0)} 50%{transform:scaleX(0.94) scaleY(1.09) translateY(-4px)} 100%{transform:scaleX(1.05) scaleY(0.94) translateY(2px)} }
@keyframes flameBg2 { 0%{transform:scaleX(1.02) scaleY(0.97) translateY(1px) rotate(-1deg)} 50%{transform:scaleX(0.96) scaleY(1.07) translateY(-5px) rotate(1.5deg)} 100%{transform:scaleX(1) scaleY(1) rotate(0deg)} }
.fire-embers-bg { position:absolute; inset:0; overflow:hidden; }
.fire-ember-bg { position:absolute; border-radius:50%; background:radial-gradient(circle,rgba(255,200,50,0.9),rgba(255,80,10,0.4) 50%,transparent); animation:emberBg linear infinite; }
@keyframes emberBg { 0%{transform:translateY(0) translateX(0);opacity:0} 5%{opacity:1} 80%{opacity:0.5} 100%{transform:translateY(var(--t)) translateX(var(--s));opacity:0} }
.fire-heat { position:absolute; inset:0; background:radial-gradient(ellipse 120% 80% at 50% 100%,rgba(255,60,5,0.18) 0%,rgba(180,20,2,0.08) 45%,transparent 75%); animation:heatWave 1.5s ease-in-out infinite alternate; }
@keyframes heatWave { 0%{opacity:0.6;transform:scaleX(0.98)} 100%{opacity:1;transform:scaleX(1.02)} }
.bg-vignette { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(0,0,0,0.4) 100%); pointer-events:none; }
.grain { position:fixed; inset:0; z-index:1; pointer-events:none; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); opacity:0.4; mix-blend-mode:screen; }

/* ── HEADER ── */
.header { position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:1.2rem 2.5rem; background:rgba(5,5,10,0.6); backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,0.06); width:100%; box-sizing:border-box; }
.header-left { display:flex; align-items:center; gap:1.5rem; }
.logo-btn { font-family:'Unbounded',sans-serif; font-weight:200; font-size:0.72rem; letter-spacing:0.45em; text-transform:uppercase; color:rgba(240,236,228,0.5); background:none; border:none; cursor:pointer; text-decoration:none; }
.logo-btn:hover { color:#f0ece4; }
.element-pill { display:flex; align-items:center; gap:0.5rem; padding:0.3rem 0.9rem; border:1px solid var(--el-accent-2); border-radius:9999px; background:var(--el-accent-3); cursor:pointer; transition:all 0.3s; }
.element-pill:hover { background:var(--el-accent-2); }
.element-pill-dot { width:6px; height:6px; border-radius:50%; background:var(--el-accent); box-shadow:0 0 8px var(--el-accent); animation:dotPulse 2s ease-in-out infinite; }
@keyframes dotPulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.4);opacity:0.7} }
.element-pill-name { font-family:'DM Mono',monospace; font-size:0.6rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--el-accent); }
.header-right { display:flex; align-items:center; gap:1rem; }
.btn-primary { font-family:'DM Mono',monospace; font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.55rem 1.3rem; background:var(--el-accent); color:#050508; border:none; border-radius:9999px; cursor:pointer; transition:all 0.3s var(--ease); }
.btn-primary:hover { transform:translateY(-2px); filter:brightness(1.1); }
.btn-ghost { font-family:'DM Mono',monospace; font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.5rem 1.1rem; background:transparent; color:rgba(255,255,255,0.45); border:1px solid rgba(255,255,255,0.12); border-radius:9999px; cursor:pointer; transition:all 0.3s; }
.btn-ghost:hover { color:rgba(255,255,255,0.8); border-color:rgba(255,255,255,0.25); }
.user-avatar { width:2rem; height:2rem; border-radius:50%; background:linear-gradient(135deg,var(--el-accent),rgba(255,255,255,0.3)); display:flex; align-items:center; justify-content:center; font-size:0.75rem; color:#050508; cursor:pointer; border:1px solid var(--el-accent-2); font-family:'DM Mono',monospace; }

/* ── MAIN ── */
.main { position:relative; z-index:10; max-width:1100px; margin:0 auto; padding:3rem 2.5rem 5rem; width:100%; }

/* ── HERO ── */
.hero { margin-bottom:4rem; animation:fadeUp 1.4s var(--ease) 0.4s both; }
.hero-eyebrow { font-family:'DM Mono',monospace; font-size:0.58rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--el-accent); opacity:0.7; margin-bottom:1rem; display:flex; align-items:center; gap:0.75rem; }
.hero-eyebrow::before { content:''; width:1.5rem; height:1px; background:var(--el-accent); opacity:0.5; }
.hero-title { font-size:clamp(2.5rem,5vw,4.5rem); font-weight:300; font-style:italic; line-height:1.1; color:#fff; margin-bottom:0.75rem; }
.hero-sub { font-size:1rem; font-weight:300; color:rgba(255,255,255,0.4); max-width:400px; line-height:1.7; }

/* ── TABS ── */
.tabs { display:flex; border-bottom:1px solid rgba(255,255,255,0.08); margin-bottom:2.5rem; animation:fadeUp 1.4s var(--ease) 0.6s both; }
.tab { font-family:'DM Mono',monospace; font-size:0.62rem; letter-spacing:0.15em; text-transform:uppercase; padding:0.85rem 1.5rem; color:rgba(255,255,255,0.3); background:none; border:none; cursor:pointer; position:relative; transition:color 0.3s; }
.tab::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:1px; background:var(--el-accent); transform:scaleX(0); transition:transform 0.3s var(--ease); }
.tab:hover { color:rgba(255,255,255,0.6); }
.tab.active { color:var(--el-accent); }
.tab.active::after { transform:scaleX(1); }

/* ── PANELS ── */
.panel { display:none; }
.panel.active { display:block; animation:fadeUp 0.6s var(--ease) both; }
.collections-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:1.5rem; }
.section-title { font-family:'Cormorant Garamond',serif; font-size:1.4rem; font-weight:300; font-style:italic; color:rgba(255,255,255,0.7); }
.section-count { font-family:'DM Mono',monospace; font-size:0.6rem; letter-spacing:0.1em; color:rgba(255,255,255,0.25); text-transform:uppercase; }

/* ── МОИ КОЛЛЕКЦИИ ── */
.collections-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1rem; }
.col-card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:1.25rem; padding:1.5rem; transition:border-color 0.3s,background 0.3s; }
.col-card:hover { border-color:var(--el-accent-2); background:rgba(255,255,255,0.06); }
.col-card-header { cursor:pointer; user-select:none; }
.col-card-element { font-family:'DM Mono',monospace; font-size:0.52rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--el-accent); opacity:0.7; margin-bottom:0.6rem; display:flex; align-items:center; gap:0.4rem; }
.col-card-element-dot { width:4px; height:4px; border-radius:50%; background:var(--el-accent); }
.col-card-title { font-size:1.2rem; font-weight:300; color:#fff; margin-bottom:0.4rem; line-height:1.3; }
.col-card-desc { font-size:0.85rem; color:rgba(255,255,255,0.35); line-height:1.6; margin-bottom:0.75rem; }
.col-card-footer { display:flex; justify-content:space-between; align-items:center; padding-top:0.75rem; border-top:1px solid rgba(255,255,255,0.06); }
.col-card-meta { font-family:'DM Mono',monospace; font-size:0.58rem; letter-spacing:0.08em; color:rgba(255,255,255,0.25); }
.card-arrow { font-size:0.8rem; color:var(--el-accent); transition:transform 0.3s; display:inline-block; }
.col-card-expand { display:none; margin-top:1rem; padding-top:0.75rem; border-top:1px solid rgba(255,255,255,0.06); }
.col-card-expand.open { display:block; }
.mat-row { display:flex; gap:0.6rem; padding:0.5rem 0; border-bottom:1px solid rgba(255,255,255,0.05); align-items:flex-start; }
.mat-row:last-of-type { border-bottom:none; }
.mat-row-cover { width:40px; height:40px; border-radius:0.4rem; flex-shrink:0; background-size:cover; background-position:center; border:1px solid rgba(255,255,255,0.08); }
.mat-row-cover--empty { background:rgba(255,255,255,0.04); }
.mat-row-num { font-family:'DM Mono',monospace; font-size:0.55rem; color:rgba(255,255,255,0.2); min-width:1.2rem; padding-top:0.2rem; }
.mat-row-body { flex:1; min-width:0; }
.mat-row-title { font-size:0.88rem; color:rgba(255,255,255,0.8); margin-bottom:0.1rem; line-height:1.4; }
.mat-row-title.clickable { cursor:pointer; }
.mat-row-title.clickable:hover { color:#fff; }
.mat-row-thought { font-size:0.78rem; font-style:italic; color:rgba(255,255,255,0.35); margin-bottom:0.1rem; }
.mat-row-domain { font-family:'DM Mono',monospace; font-size:0.55rem; color:var(--el-accent); opacity:0.7; }
.mat-del-btn { background:none; border:none; color:rgba(224,90,58,0.4); cursor:pointer; font-size:0.85rem; padding:0.1rem 0.3rem; flex-shrink:0; transition:color 0.2s; line-height:1; }
.mat-del-btn:hover { color:rgba(224,90,58,0.9); }
.col-card-controls { display:flex; gap:0.5rem; margin-top:1rem; }
.btn-add-mat { flex:1; padding:0.6rem; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:0.75rem; color:rgba(255,255,255,0.6); font-family:'DM Mono',monospace; font-size:0.62rem; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; transition:all 0.2s; }
.btn-add-mat:hover { background:rgba(255,255,255,0.1); color:#fff; }
.btn-del-col { padding:0.6rem 0.9rem; background:none; border:1px solid rgba(224,90,58,0.25); border-radius:0.75rem; color:rgba(224,90,58,0.5); font-family:'DM Mono',monospace; font-size:0.62rem; cursor:pointer; transition:all 0.2s; }
.btn-del-col:hover { border-color:rgba(224,90,58,0.6); color:rgba(224,90,58,0.9); }

/* ── EMPTY STATE ── */
.empty-state { text-align:center; padding:5rem 2rem; border:1px dashed rgba(255,255,255,0.08); border-radius:1.5rem; }
.empty-glyph { font-size:3rem; margin-bottom:1rem; filter:drop-shadow(0 0 20px var(--el-accent)); animation:emptyPulse 3s ease-in-out infinite; }
@keyframes emptyPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
.empty-title { font-size:1.4rem; font-weight:300; font-style:italic; margin-bottom:0.5rem; color:rgba(255,255,255,0.7); }
.empty-sub { font-size:0.85rem; color:rgba(255,255,255,0.3); margin-bottom:1.5rem; line-height:1.7; }

/* ── ЛЕНТА: КОЛЛЕКЦИЯ С ШАПКОЙ ── */
.feed-col-card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:1rem; overflow:hidden; margin-bottom:1rem; transition:border-color 0.3s; animation:fadeUp 0.5s var(--ease) both; }
.feed-col-card:hover { border-color:var(--el-accent-2); }
.feed-col-cover { width:100%; aspect-ratio:16/5; background-size:cover; background-position:center; border-bottom:1px solid rgba(255,255,255,0.06); }
.feed-col-cover--empty { background:linear-gradient(135deg,rgba(232,120,64,0.08) 0%,rgba(180,60,10,0.04) 100%); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
.feed-col-cover--empty::after { content:''; position:absolute; inset:0; background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(255,255,255,0.012) 10px,rgba(255,255,255,0.012) 11px); }
.feed-col-cover-label { font-size:0.38rem; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.15); position:relative; z-index:1; }
.feed-col-body { padding:1rem 1.25rem 1.25rem; }
.feed-col-author { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.65rem; }
.feed-avatar-sm { width:1.5rem; height:1.5rem; border-radius:50%; background:linear-gradient(135deg,var(--el-accent),rgba(255,255,255,0.2)); display:flex; align-items:center; justify-content:center; font-family:'DM Mono',monospace; font-size:0.58rem; color:#050508; flex-shrink:0; border:1px solid var(--el-accent-2); }
.feed-author-name { font-size:0.82rem; font-weight:500; color:rgba(255,255,255,0.8); }
.feed-author-time { font-family:'DM Mono',monospace; font-size:0.55rem; color:rgba(255,255,255,0.2); margin-left:auto; }
.feed-col-name { font-family:'Cormorant Garamond',serif; font-size:1.15rem; font-weight:300; color:#fff; margin-bottom:0.3rem; line-height:1.3; }
.feed-col-desc { font-size:0.8rem; color:rgba(255,255,255,0.35); line-height:1.5; margin-bottom:0.5rem; }
.feed-col-meta { font-family:'DM Mono',monospace; font-size:0.55rem; letter-spacing:0.08em; color:rgba(255,255,255,0.2); text-transform:uppercase; margin-bottom:0.75rem; }
.feed-col-mats { border-top:1px solid rgba(255,255,255,0.05); padding-top:0.65rem; margin-bottom:0.85rem; }
.feed-mat-row { display:flex; align-items:center; gap:0.6rem; padding:0.35rem 0; border-bottom:1px solid rgba(255,255,255,0.03); }
.feed-mat-row:last-child { border-bottom:none; }
.feed-mat-thumb { width:36px; height:36px; border-radius:0.3rem; flex-shrink:0; background-size:cover; background-position:center; border:1px solid rgba(255,255,255,0.07); }
.feed-mat-thumb--empty { background:rgba(255,255,255,0.04); }
.feed-mat-text { flex:1; min-width:0; }
.feed-mat-title { font-size:0.82rem; color:rgba(255,255,255,0.65); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.3; }
.feed-mat-domain { font-family:'DM Mono',monospace; font-size:0.52rem; color:var(--el-accent); opacity:0.6; }
.btn-follow { font-family:'DM Mono',monospace; font-size:0.58rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.45rem 1rem; background:var(--el-accent-3); border:1px solid var(--el-accent-2); border-radius:9999px; color:var(--el-accent); cursor:pointer; transition:all 0.25s; margin-top:0.25rem; }
.btn-follow:hover { background:var(--el-accent-2); }
.btn-follow.following { background:transparent; color:rgba(255,255,255,0.3); border-color:rgba(255,255,255,0.1); }

/* ── ЛЕНТА: ГРУППА ── */
.feed-group-card { background:rgba(232,120,64,0.035); border:1px solid rgba(232,120,64,0.12); border-radius:1rem; margin-bottom:1rem; overflow:hidden; transition:border-color 0.3s; animation:fadeUp 0.5s var(--ease) both; }
.feed-group-card:hover { border-color:rgba(232,120,64,0.25); }
.feed-group-header { padding:1rem 1.25rem 0.75rem; border-bottom:1px solid rgba(255,255,255,0.05); }
.feed-group-name { font-family:'Cormorant Garamond',serif; font-size:1.25rem; font-weight:300; font-style:italic; color:#fff; margin-bottom:0.2rem; }
.feed-group-meta { font-family:'DM Mono',monospace; font-size:0.52rem; letter-spacing:0.08em; text-transform:uppercase; color:rgba(255,255,255,0.2); }
.feed-group-cols { padding:0.6rem 1.25rem; border-bottom:1px solid rgba(255,255,255,0.05); }
.feed-group-col-row { display:flex; align-items:center; gap:0.6rem; padding:0.3rem 0; }
.feed-group-col-dot { font-size:0.6rem; color:var(--el-accent); opacity:0.5; flex-shrink:0; }
.feed-group-col-name { font-size:0.85rem; color:rgba(255,255,255,0.6); flex:1; }
.feed-group-col-cnt { font-family:'DM Mono',monospace; font-size:0.55rem; color:rgba(255,255,255,0.2); }
.feed-group-card > .btn-follow { margin:0.75rem 1.25rem 1rem; }

/* ── MODAL ── */
.modal-overlay { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.75); backdrop-filter:blur(20px); display:flex; align-items:center; justify-content:center; padding:2rem; opacity:0; pointer-events:none; transition:opacity 0.3s; }
.modal-overlay.open { opacity:1; pointer-events:all; }
.modal { background:#0e0e16; border:1px solid rgba(255,255,255,0.1); border-radius:1.75rem; padding:2.5rem; width:100%; max-width:540px; max-height:90vh; overflow-y:auto; animation:slideUp 0.4s var(--ease); }
.modal-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2rem; }
.modal-title { font-size:1.6rem; font-weight:300; font-style:italic; color:#fff; }
.modal-close { background:none; border:none; color:rgba(255,255,255,0.3); font-size:1.4rem; cursor:pointer; transition:color 0.2s; line-height:1; }
.modal-close:hover { color:#fff; }
.form-group { margin-bottom:1.25rem; }
.form-label { display:block; font-family:'DM Mono',monospace; font-size:0.6rem; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,255,255,0.3); margin-bottom:0.6rem; }
.req { color:var(--el-accent); margin-left:0.2rem; }
.form-input,.form-textarea,.form-select { width:100%; padding:0.8rem 1rem; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:0.75rem; color:#fff; font-family:'Cormorant Garamond',serif; font-size:1rem; outline:none; transition:border-color 0.3s,background 0.3s; }
.form-input:focus,.form-textarea:focus,.form-select:focus { border-color:var(--el-accent); background:rgba(255,255,255,0.07); }
.form-input::placeholder,.form-textarea::placeholder { color:rgba(255,255,255,0.2); }
.form-textarea { resize:vertical; min-height:90px; }
.form-select { cursor:pointer; }
.form-select option { background:#0e0e16; }
.element-selector { display:grid; grid-template-columns:repeat(4,1fr); gap:0.6rem; margin-top:0.5rem; }
.el-sel-btn { padding:0.6rem 0.4rem; border-radius:0.75rem; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.03); cursor:pointer; transition:all 0.3s; text-align:center; font-family:'DM Mono',monospace; font-size:0.55rem; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.35); }
.el-sel-btn:hover { border-color:rgba(255,255,255,0.18); color:rgba(255,255,255,0.65); }
.el-sel-btn.selected { border-color:var(--el-accent); color:var(--el-accent); background:var(--el-accent-3); }
.el-sel-btn .el-icon { font-size:1.2rem; display:block; margin-bottom:0.3rem; }
.mat-type-tabs { display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap; }
.mat-type-btn { padding:0.35rem 0.85rem; border-radius:9999px; border:1px solid rgba(255,255,255,0.1); background:transparent; font-family:'DM Mono',monospace; font-size:0.58rem; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.35); cursor:pointer; transition:all 0.25s; }
.mat-type-btn:hover { border-color:rgba(255,255,255,0.2); color:rgba(255,255,255,0.6); }
.mat-type-btn.active { border-color:var(--el-accent); color:var(--el-accent); background:var(--el-accent-3); }
.toggle-row { display:flex; align-items:center; justify-content:space-between; padding:0.6rem 0; }
.toggle-label { font-size:0.88rem; color:rgba(255,255,255,0.5); }
.toggle { position:relative; width:2.4rem; height:1.3rem; }
.toggle input { opacity:0; width:0; height:0; }
.toggle-slider { position:absolute; inset:0; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); border-radius:9999px; cursor:pointer; transition:0.25s; }
.toggle-slider::before { content:''; position:absolute; width:0.85rem; height:0.85rem; left:0.2rem; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.4); border-radius:50%; transition:0.25s; }
.toggle input:checked + .toggle-slider { background:var(--el-accent-2); border-color:var(--el-accent); }
.toggle input:checked + .toggle-slider::before { transform:translateX(1.1rem) translateY(-50%); background:var(--el-accent); }
.modal-actions { display:flex; gap:0.75rem; margin-top:1.5rem; }
.modal-actions .btn-ghost { flex:1; text-align:center; }
.modal-actions .btn-primary { flex:2; text-align:center; }

/* ── LOADING & TOAST ── */
.loading { display:flex; align-items:center; gap:0.5rem; padding:3rem 0; justify-content:center; font-family:'DM Mono',monospace; font-size:0.7rem; color:rgba(255,255,255,0.2); }
.loading-dot { width:5px; height:5px; border-radius:50%; background:var(--el-accent); animation:ldot 1.2s ease-in-out infinite; }
.loading-dot:nth-child(2) { animation-delay:0.2s; }
.loading-dot:nth-child(3) { animation-delay:0.4s; }
@keyframes ldot { 0%,100%{opacity:0.2;transform:scale(1)} 50%{opacity:1;transform:scale(1.3)} }
.toast-area { position:fixed; bottom:2rem; right:2rem; z-index:999; display:flex; flex-direction:column; gap:0.5rem; }
.toast { padding:0.75rem 1.25rem; background:rgba(14,14,22,0.95); border:1px solid rgba(255,255,255,0.1); border-radius:0.75rem; font-size:0.82rem; color:#fff; animation:toastIn 0.3s var(--ease); max-width:280px; backdrop-filter:blur(20px); }
.toast.success { border-color:var(--el-accent); color:var(--el-accent); }
.toast.error { border-color:#e05a3a; color:#e05a3a; }

/* ── ANIMATIONS ── */
@keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
@keyframes toastIn { from{opacity:0;transform:translateX(1rem)} to{opacity:1;transform:translateX(0)} }

@media (max-width:768px) {
    .header { padding:0.75rem 1rem; }
    .main { padding:2rem 1.25rem 4rem; }
    .collections-grid { grid-template-columns:1fr; }
    .element-selector { grid-template-columns:repeat(2,1fr); }
    .btn-primary { font-size:0.58rem; padding:0.45rem 0.9rem; }
}
</style>
</head>

<script>
// ── STATE ──
let currentUser = null;
const currentElement = 'fire';
let collectionsCache = {};
let selectedElement = 'fire';
let currentMatType = 'link';
const DIANA_USER_ID = 2;

// ── PARTICLES ──
(function spawnEmbers() {
    const fc = document.getElementById('fire-embers');
    if (!fc) return;
    for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'fire-ember-bg';
        const sz = 1.5 + Math.random() * 4;
        p.style.cssText = `width:${sz}px;height:${sz}px;left:${10+Math.random()*80}%;bottom:${Math.random()*25}%;--t:${-(100+Math.random()*200)}px;--s:${(Math.random()-.5)*70}px;animation-duration:${2+Math.random()*3}s;animation-delay:-${Math.random()*5}s;`;
        fc.appendChild(p);
    }
})();

// ── TOAST ──
function toast(msg, type='') {
    const a = document.getElementById('toast-area');
    if (!a) return;
    const d = document.createElement('div');
    d.className = 'toast ' + type; d.textContent = msg;
    a.appendChild(d); setTimeout(() => d.remove(), 3500);
}

// ── API ──
function getNonce() { return window.budumConfig?.nonce || window.wpApiSettings?.nonce || ''; }
async function api(path, opts={}) {
    try {
        const headers = {'Content-Type':'application/json','X-WP-Nonce':getNonce(),...(opts.headers||{})};
        const res = await fetch('/wp-json/wp/v2/' + path, {credentials:'same-origin', headers, ...opts});
        if (!res.ok) { console.error('API', path, res.status); return null; }
        return res.json();
    } catch(e) { console.error('API', path, e); return null; }
}

// ── AUTH ──
async function checkAuth() {
    if (window.budumConfig?.isLogged && window.budumConfig?.userId) {
        currentUser = { id: window.budumConfig.userId, name: window.budumConfig.userName || 'Пользователь' };
        const av = document.getElementById('user-avatar');
        if (av) av.textContent = currentUser.name.charAt(0).toUpperCase();
        return;
    }
    const data = await api('users/me');
    if (data?.id) {
        currentUser = { id: data.id, name: data.name };
        const av = document.getElementById('user-avatar');
        if (av) av.textContent = data.name.charAt(0).toUpperCase();
    }
}

// ── HELPERS ──
function getUrl(m) { return m?.url?.startsWith?.('http') ? m.url : m?.meta?.url?.startsWith?.('http') ? m.meta.url : ''; }
function getComment(m) { return m?.comment || m?.meta?.comment || ''; }
function getDomain(url) { try { return new URL(url).hostname.replace(/^www\./,'') } catch { return '' } }
function formatDate(iso) { try { return new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}) } catch { return '' } }

function getElementFromCollection(c) {
    const map = {'вода':'water','воздух':'air','огонь':'fire','земля':'earth','water':'water','air':'air','fire':'fire','earth':'earth'};
    let e = c?.element || c?.meta?.element || '';
    if (Array.isArray(e)) e = e[0] || '';
    return map[(typeof e === 'string' ? e.toLowerCase().trim() : '')] || '';
}

function isPublic(c) {
    const privacy = Array.isArray(c.privacy) ? c.privacy.join('') : (c.privacy || '');
    const p = privacy.toLowerCase();
    return !(p.includes('private') || p.includes('приватн'));
}

function isMyCollection(c) {
    if (!currentUser) return false;
    const uid = String(currentUser.id);
    const authors = c.collection_author;
    if (authors && Array.isArray(authors) && authors.length) {
        return authors.some(a => typeof a === 'object' ? String(a.ID||a.id||'') === uid : String(a) === uid);
    }
    if (authors && !Array.isArray(authors)) return String(authors) === uid;
    return c.author ? String(c.author) === uid : false;
}

function getAuthorId(c) {
    const authors = c.collection_author;
    if (Array.isArray(authors) && authors.length) {
        const a = authors[0];
        return String(typeof a === 'object' ? (a.ID||a.id||'') : a);
    }
    if (authors && !Array.isArray(authors)) return String(authors);
    return String(c.author || '');
}

function getCoverUrl(c) { return c.cover_url || c.meta?.cover_url || ''; }
function getGroupName(c) { return c.group_name || c.meta?.group_name || ''; }

function pluralMat(n) {
    if (n % 10 === 1 && n % 100 !== 11) return '';
    if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return 'а';
    return 'ов';
}
function pluralCol(n) {
    if (n % 10 === 1 && n % 100 !== 11) return 'ия';
    if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return 'ии';
    return 'ий';
}

// ── МОИ КОЛЛЕКЦИИ ──
async function loadMyCollections() {
    const grid = document.getElementById('mine-grid');
    const countEl = document.getElementById('mine-count');
    if (!grid) return;

    if (!currentUser) {
        grid.innerHTML = '<div class="empty-state"><div class="empty-glyph">◈</div><div class="empty-title">Войди, чтобы видеть коллекции</div><button class="btn-primary" onclick="window.location.href=\'/login/\'">Войти →</button></div>';
        if (countEl) countEl.textContent = '';
        return;
    }

    const all = await api('collection?per_page=100') || [];
    const uid = String(currentUser.id);

    const mine = all.filter(c => {
        const authors = c.collection_author;
        if (!authors || authors === false) return c.author && String(c.author) === uid;
        const arr = Array.isArray(authors) ? authors : [authors];
        return arr.some(a => !a ? false : typeof a === 'object' ? String(a.ID||a.id||'') === uid : String(a) === uid);
    }).filter(c => {
        const el = getElementFromCollection(c);
        return !el || el === currentElement;
    });

    if (countEl) countEl.textContent = mine.length + ' коллекций';

    if (!mine.length) {
        grid.innerHTML = '<div class="empty-state"><div class="empty-glyph">◈</div><div class="empty-title">Пока нет коллекций в Огне</div><div class="empty-sub">Создай первую — сохрани то, что тебя зажигает</div><button class="btn-primary" onclick="openCreateModal()">+ Создать коллекцию</button></div>';
        return;
    }

    const cards = await Promise.all(mine.map(async c => {
        const mats = await getCollectionMaterials(c.id);
        return renderCollectionCard(c, mats, true);
    }));
    grid.innerHTML = '<div class="collections-grid">' + cards.join('') + '</div>';
}

// ── ЛЕНТА ──
async function loadFriendsFeed() {
    const feedEl = document.getElementById('friends-feed');
    const countEl = document.getElementById('friends-count');
    if (!feedEl) return;
    feedEl.innerHTML = '<div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div><span>загружаем</span></div>';

    const all = await api('collection?per_page=100') || [];

    const friendCols = all.filter(c => {
        if (isMyCollection(c)) return false;
        if (!isPublic(c)) return false;
        if (getAuthorId(c) !== String(DIANA_USER_ID)) return false;
        const el = getElementFromCollection(c);
        return !el || el === currentElement;
    });

    const groups = {};
    const soloCollections = [];

    friendCols.forEach(c => {
        const gn = getGroupName(c);
        if (gn) { if (!groups[gn]) groups[gn] = []; groups[gn].push(c); }
        else soloCollections.push(c);
    });

    const totalItems = Object.keys(groups).length + soloCollections.length;
    if (countEl) countEl.textContent = totalItems ? totalItems + ' обновлений' : '';

    if (!totalItems) {
        feedEl.innerHTML = '<div class="empty-state"><div class="empty-title">Лента пока пустая</div><div class="empty-sub">Здесь будут появляться публичные коллекции друзей</div></div>';
        return;
    }

    const feedItems = [];
    for (const [gn, cols] of Object.entries(groups)) {
        cols.sort((a,b) => new Date(b.date) - new Date(a.date));
        feedItems.push({ type:'group', groupName:gn, cols, date:cols[0].date });
    }
    for (const c of soloCollections) {
        const mats = await getCollectionMaterials(c.id);
        feedItems.push({ type:'collection', col:c, mats, date:c.date });
    }
    feedItems.sort((a,b) => new Date(b.date) - new Date(a.date));

    feedEl.innerHTML = feedItems.map(item =>
        item.type === 'group'
            ? renderFeedGroupCard(item.groupName, item.cols, 'Диана')
            : renderFeedCollectionCard(item.col, item.mats, 'Диана')
    ).join('');
}

// ── GET MATERIALS ──
async function getCollectionMaterials(id) {
    if (collectionsCache[id]) return collectionsCache[id];
    const data = await api('material?per_page=100') || [];
    const filtered = data.filter(m => {
        const col = m.collection;
        if (!col) return false;
        if (Array.isArray(col)) return col.some(v => String(v?.ID||v?.id||v) === String(id));
        if (typeof col === 'object') return String(col.ID||col.id) === String(id);
        return String(col) === String(id);
    });
    collectionsCache[id] = filtered;
    return filtered;
}

// ── RENDER: МОЯ КОЛЛЕКЦИЯ ──
function renderCollectionCard(c, mats, isOwner) {
    const id = c.id;
    const title = c.title?.rendered || 'Без названия';
    const desc = c.content?.rendered ? c.content.rendered.replace(/<[^>]+>/g,'') : '';
    const groupName = getGroupName(c);

    const matHtml = mats.length === 0
        ? '<div style="padding:0.5rem 0;font-size:0.85rem;color:rgba(240,236,228,0.3);font-style:italic">Пока нет материалов</div>'
        : mats.map((m, i) => {
            const url = getUrl(m);
            const domain = url ? getDomain(url) : '';
            const thought = getComment(m);
            const imgUrl = m.image_url || m.meta?.image_url || '';
            return '<div class="mat-row">'
                + (imgUrl ? '<div class="mat-row-cover" style="background-image:url(\'' + imgUrl + '\')"></div>' : '<div class="mat-row-cover mat-row-cover--empty"></div>')
                + '<span class="mat-row-num">' + (i+1) + '</span>'
                + '<div class="mat-row-body">'
                + '<div class="mat-row-title' + (url?' clickable':'') + '"' + (url?' onclick="window.open(\'' + url.replace(/'/g,"\\'") + '\',\'_blank\')"' : '') + '>' + (m.title?.rendered||'Материал') + '</div>'
                + (thought ? '<div class="mat-row-thought">' + thought + '</div>' : '')
                + (domain ? '<div class="mat-row-domain">↗ ' + domain + '</div>' : '')
                + '</div>'
                + (isOwner ? '<button class="mat-del-btn" data-mat-id="' + m.id + '" data-col-id="' + id + '" title="Удалить">✕</button>' : '')
                + '</div>';
        }).join('');

    const controls = isOwner
        ? '<div class="col-card-controls"><button class="btn-add-mat" data-col-id="' + id + '">+ Добавить материал</button><button class="btn-del-col" data-col-id="' + id + '">Удалить</button></div>'
        : '';

    return '<div class="col-card" data-id="' + id + '">'
        + '<div class="col-card-header" data-col-id="' + id + '">'
        + '<div class="col-card-element"><div class="col-card-element-dot"></div>Огонь' + (groupName ? ' · ' + groupName : '') + '</div>'
        + '<div class="col-card-title">' + title + '</div>'
        + (desc ? '<div class="col-card-desc">' + desc + '</div>' : '')
        + '<div class="col-card-footer"><span class="col-card-meta">' + mats.length + ' материалов · ' + formatDate(c.date) + '</span><span class="card-arrow">▾</span></div>'
        + '</div>'
        + '<div class="col-card-expand" id="exp-' + id + '">' + matHtml + controls + '</div>'
        + '</div>';
}

// ── RENDER: КАРТОЧКА КОЛЛЕКЦИИ В ЛЕНТЕ (с шапкой) ──
function renderFeedCollectionCard(c, mats, authorName) {
    const id = c.id;
    const title = c.title?.rendered || 'Без названия';
    const desc = c.content?.rendered ? c.content.rendered.replace(/<[^>]+>/g,'') : '';
    const coverUrl = getCoverUrl(c);
    const groupName = getGroupName(c);

    const coverHtml = coverUrl
        ? '<div class="feed-col-cover" style="background-image:url(\'' + coverUrl + '\')"></div>'
        : '<div class="feed-col-cover feed-col-cover--empty"><span class="feed-col-cover-label">обложка</span></div>';

    const matPreview = mats.length
        ? '<div class="feed-col-mats">' + mats.slice(0,3).map(m => {
            const url = getUrl(m);
            const domain = url ? getDomain(url) : '';
            const imgUrl = m.image_url || m.meta?.image_url || '';
            return '<div class="feed-mat-row"' + (url ? ' onclick="window.open(\'' + url.replace(/'/g,"\\'") + '\',\'_blank\')" style="cursor:pointer"' : '') + '>'
                + (imgUrl ? '<div class="feed-mat-thumb" style="background-image:url(\'' + imgUrl + '\')"></div>' : '<div class="feed-mat-thumb feed-mat-thumb--empty"></div>')
                + '<div class="feed-mat-text"><div class="feed-mat-title">' + (m.title?.rendered||'Материал') + '</div>' + (domain ? '<div class="feed-mat-domain">↗ ' + domain + '</div>' : '') + '</div>'
                + '</div>';
          }).join('') + '</div>'
        : '';

    return '<div class="feed-col-card">'
        + coverHtml
        + '<div class="feed-col-body">'
        + '<div class="feed-col-author"><div class="feed-avatar-sm">' + authorName.charAt(0) + '</div><span class="feed-author-name">' + authorName + '</span><span class="feed-author-time">' + formatDate(c.date) + '</span></div>'
        + '<div class="feed-col-name">' + title + '</div>'
        + (desc ? '<div class="feed-col-desc">' + desc + '</div>' : '')
        + '<div class="feed-col-meta">' + mats.length + ' материал' + pluralMat(mats.length) + (groupName ? ' · ' + groupName : '') + '</div>'
        + matPreview
        + '<button class="btn-follow" onclick="handleFollow(this,\'col\',' + id + ')">+ Следить</button>'
        + '</div></div>';
}

// ── RENDER: КАРТОЧКА ГРУППЫ В ЛЕНТЕ ──
function renderFeedGroupCard(groupName, cols, authorName) {
    const totalMats = cols.reduce((s, c) => s + (collectionsCache[c.id]?.length || 0), 0);
    const newestDate = cols[0].date;

    const colList = cols.map(c => {
        const title = c.title?.rendered || 'Без названия';
        const cnt = collectionsCache[c.id]?.length || 0;
        return '<div class="feed-group-col-row"><span class="feed-group-col-dot">◈</span><span class="feed-group-col-name">' + title + '</span><span class="feed-group-col-cnt">' + cnt + '</span></div>';
    }).join('');

    return '<div class="feed-group-card">'
        + '<div class="feed-group-header">'
        + '<div class="feed-col-author"><div class="feed-avatar-sm">' + authorName.charAt(0) + '</div><span class="feed-author-name">' + authorName + '</span><span class="feed-author-time">' + formatDate(newestDate) + '</span></div>'
        + '<div class="feed-group-name">' + groupName + '</div>'
        + '<div class="feed-group-meta">' + cols.length + ' коллекц' + pluralCol(cols.length) + ' · ' + totalMats + ' материал' + pluralMat(totalMats) + '</div>'
        + '</div>'
        + (colList ? '<div class="feed-group-cols">' + colList + '</div>' : '')
        + '<button class="btn-follow" onclick="handleFollow(this,\'group\',\'' + groupName.replace(/'/g,"\\'") + '\')">+ Следить</button>'
        + '</div>';
}

// ── FOLLOW ──
function handleFollow(btn, type, id) {
    const isFollowing = btn.dataset.following === '1';
    if (isFollowing) { btn.textContent = '+ Следить'; btn.dataset.following = '0'; btn.classList.remove('following'); }
    else { btn.textContent = '✓ Следите'; btn.dataset.following = '1'; btn.classList.add('following'); }
}

// ── TABS ──
function switchTab(tab, btn) {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + tab)?.classList.add('active');
    if (tab === 'friends') loadFriendsFeed();
}

// ── CREATE MODAL ──
function openCreateModal() {
    if (!currentUser) { window.location.href='/login/'; return; }
    document.getElementById('col-title').value = '';
    document.getElementById('col-desc').value = '';
    const cg = document.getElementById('col-group'); if (cg) cg.value = '';
    document.getElementById('col-public').checked = true;
    selectedElement = currentElement;
    document.querySelectorAll('.el-sel-btn').forEach(b => b.classList.toggle('selected', b.dataset.el === currentElement));
    document.getElementById('create-modal')?.classList.add('open');
    setTimeout(() => document.getElementById('col-title')?.focus(), 100);
}
function closeCreateModal() { document.getElementById('create-modal')?.classList.remove('open'); }

function selectElement(el, btn) {
    selectedElement = el;
    document.querySelectorAll('.el-sel-btn').forEach(b => b.classList.remove('selected'));
    if (btn) btn.classList.add('selected');
}

async function saveCollection() {
    const title = document.getElementById('col-title')?.value.trim();
    if (!title) { toast('Введи название коллекции','error'); return; }
    const btn = document.querySelector('#create-modal .btn-primary');
    if (btn) { btn.textContent='Создаём...'; btn.disabled=true; }

    const groupName = document.getElementById('col-group')?.value.trim() || '';
    const result = await api('collection', {
        method:'POST',
        body: JSON.stringify({
            title,
            content: document.getElementById('col-desc')?.value.trim() || '',
            status: 'publish',
            author: currentUser?.id,
            collection_author: [currentUser?.id],
            element: selectedElement,
            privacy: document.getElementById('col-public')?.checked ? 'Публичная/public' : 'Приватная/private',
            group_name: groupName,
        })
    });

    if (btn) { btn.textContent='Создать →'; btn.disabled=false; }
    if (result?.id) { toast('Коллекция создана!','success'); collectionsCache={}; closeCreateModal(); loadMyCollections(); }
    else toast('Ошибка при создании','error');
}

// ── MATERIAL MODAL ──
function openAddMaterial(collectionId) {
    if (!currentUser) { window.location.href='/login/'; return; }
    const modal = document.getElementById('material-modal');
    if (!modal) return;
    ['mat-url','mat-title','mat-source','mat-thought','mat-note-title','mat-image-url','mat-image-caption'].forEach(id => {
        const el = document.getElementById(id); if (el) el.value = '';
    });
    loadCollectionsForSelect(collectionId);
    setMatType('link', document.querySelector('.mat-type-btn[data-type="link"]'));
    modal.classList.add('open');
    setTimeout(() => document.getElementById('mat-url')?.focus(), 100);
}
function closeMaterialModal() { document.getElementById('material-modal')?.classList.remove('open'); }

function setMatType(type, btn) {
    currentMatType = type;
    document.querySelectorAll('.mat-type-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    document.getElementById('mat-link-fields').style.display = type==='link' ? '' : 'none';
    document.getElementById('mat-note-fields').style.display = type==='note' ? '' : 'none';
    document.getElementById('mat-image-fields').style.display = type==='image' ? '' : 'none';
}

async function loadCollectionsForSelect(selectedId) {
    const select = document.getElementById('mat-collection');
    if (!select) return;
    select.innerHTML = '<option>Загружаем...</option>';
    const all = await api('collection?per_page=100&author=' + (currentUser?.id||0)) || [];
    select.innerHTML = all.length
        ? all.map(c => '<option value="' + c.id + '"' + (c.id==selectedId?' selected':'') + '>' + (c.title?.rendered||'Без названия') + '</option>').join('')
        : '<option value="">Сначала создайте коллекцию</option>';
}

async function saveMaterial() {
    const thought = document.getElementById('mat-thought')?.value.trim();
    const collectionId = document.getElementById('mat-collection')?.value;
    if (!thought) { toast('Добавь свою мысль — это главное','error'); return; }
    if (!collectionId) { toast('Выбери коллекцию','error'); return; }

    let title='', url='', source='';
    if (currentMatType==='link') {
        url = document.getElementById('mat-url')?.value.trim();
        title = document.getElementById('mat-title')?.value.trim();
        source = document.getElementById('mat-source')?.value.trim()||'';
        if (!url) { toast('Введи ссылку','error'); return; }
        if (!title) { toast('Введи заголовок','error'); return; }
    } else if (currentMatType==='note') {
        title = document.getElementById('mat-note-title')?.value.trim()||'Заметка';
    } else if (currentMatType==='image') {
        url = document.getElementById('mat-image-url')?.value.trim();
        title = document.getElementById('mat-image-caption')?.value.trim()||'Образ';
        if (!url) { toast('Введи URL изображения','error'); return; }
    }

    const btn = document.querySelector('#material-modal .btn-primary');
    if (btn) { btn.textContent='Сохраняем...'; btn.disabled=true; }

    const result = await api('material', {
        method:'POST',
        body: JSON.stringify({ title, status:'publish', url, source, comment:thought, collection:collectionId })
    });

    if (btn) { btn.textContent='Сохранить →'; btn.disabled=false; }
    if (result?.id) { toast('Материал добавлен!','success'); delete collectionsCache[collectionId]; closeMaterialModal(); loadMyCollections(); }
    else toast('Ошибка при сохранении','error');
}

// ── DELETE ──
async function deleteCollection(id) {
    const res = await api('collection/' + id + '?force=true', {method:'DELETE'});
    if (res !== null) { toast('Коллекция удалена','success'); collectionsCache={}; loadMyCollections(); }
    else toast('Ошибка при удалении','error');
}
async function deleteMaterial(matId, colId) {
    const res = await api('material/' + matId + '?force=true', {method:'DELETE'});
    if (res !== null) { toast('Материал удалён','success'); delete collectionsCache[colId]; loadMyCollections(); }
    else toast('Ошибка при удалении','error');
}

// ── КЛИКИ ──
document.addEventListener('click', function(e) {
    const addBtn = e.target.closest('.btn-add-mat');
    if (addBtn) { e.preventDefault(); e.stopPropagation(); openAddMaterial(addBtn.dataset.colId); return; }

    const delCol = e.target.closest('.btn-del-col');
    if (delCol) { e.preventDefault(); e.stopPropagation(); if (confirm('Удалить коллекцию?')) deleteCollection(delCol.dataset.colId); return; }

    const delMat = e.target.closest('.mat-del-btn');
    if (delMat) { e.preventDefault(); e.stopPropagation(); if (confirm('Удалить материал?')) deleteMaterial(delMat.dataset.matId, delMat.dataset.colId); return; }

    const header = e.target.closest('.col-card-header');
    if (header) {
        const colId = header.dataset.colId;
        const expand = document.getElementById('exp-' + colId);
        const arrow = header.querySelector('.card-arrow');
        if (!expand) return;
        const isOpen = expand.classList.contains('open');
        expand.classList.toggle('open', !isOpen);
        if (arrow) arrow.style.transform = isOpen ? '' : 'rotate(180deg)';
    }
});

// ── INIT ──
(async () => {
    await checkAuth();
    await loadMyCollections();
})();
</script>
</body>
</html>
